<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chelsea's room · 记录人生</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23FCE4EC'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23E88CA8'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<style>
@import url('https://miaoda.feishu.cn/fonts/css2?family=LXGW+WenKai&family=Dancing+Script:wght@500;700&family=VT323&display=swap');
:root{
  --bg:#FCE4EC;          /* 奶油粉 */
  --bg2:#FDF2F6;
  --card:#FFFBFD;
  --line:#F6D7E2; --line2:#EEC4D2;
  --ink:#5A4A52; --ink-dim:#8C7A83; --ink-faint:#B9A6AE;
  --pink:#E88CA8;        /* 蔷薇粉 */
  --coral:#F09A9A;
  --mint:#B7D8C8; --lemon:#F6DFA8; --lilac:#CDBBE6; --blue:#9FB8C8;
  --dance:'Dancing Script',cursive;
  --kai:'LXGW WenKai','Kaiti SC','STKaiti','PingFang SC','Microsoft YaHei',serif;
  --pixel:'VT323',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Georgia,'LXGW WenKai','Kaiti SC','STKaiti','PingFang SC',serif;background-color:var(--bg);color:var(--ink);min-height:100vh;line-height:1.85;background-image:radial-gradient(rgba(255,255,255,.65) 3px,transparent 4px);background-size:26px 26px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--kai);font-weight:700}
.hand{font-family:var(--dance)}
.term{font-family:var(--pixel);letter-spacing:.08em}

/* ===== 欢迎页 Chelsea's room ===== */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(165deg,#FDE7EE 0%,#FBE0EA 40%,#F7E7F0 75%,#FCEBF0 100%);text-align:center;padding:20px;transition:opacity .6s;overflow:hidden}
#splash .grain{position:absolute;inset:0;opacity:.5;pointer-events:none;background-image:radial-gradient(rgba(200,140,165,.12) 1px,transparent 1px);background-size:22px 22px}
#splash .glow{position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(232,140,168,.18),transparent 65%);pointer-events:none}
#splash .doodle{position:absolute;pointer-events:none;opacity:.5;font-size:26px;color:#D47592}
.sp-photo{position:absolute;border-radius:10px;box-shadow:0 14px 34px rgba(200,140,165,.35);pointer-events:none;z-index:2}
.sp-photo .ph{overflow:hidden;border-radius:7px;background:#FDF0F5}
.sp-photo .ph img{width:100%;height:100%;object-fit:cover}
.sp-photo .cap{font-family:var(--dance);color:#B0708C;text-align:center;font-size:15px;padding:6px 4px 2px;background:#fff}
#spPolaroid{width:min(30vw,190px);transform:rotate(6deg);top:6%;right:6%}
#spPolaroid .ph{position:relative;padding-top:100%;overflow:hidden}
#spPolaroid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 26%}
#spWin{width:min(34vw,220px);transform:rotate(-5deg);bottom:7%;left:6%;background:linear-gradient(180deg,#FFE4ED,#F9C9D9);border:1px solid #F2AFC5}
#spWin .titlebar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#F2AFC5;border-radius:8px 8px 0 0;font-family:var(--pixel);font-size:15px;color:#fff;letter-spacing:.05em}
#spWin .dots{display:flex;gap:4px;margin-right:6px}
#spWin .dots i{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.9}
#spWin .winbody{position:relative;padding-top:133.33%;overflow:hidden}
#spWin .winbody img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 46%}
#splash .room{font-family:var(--dance);font-size:clamp(46px,9.5vw,92px);color:#E88CA8;letter-spacing:.03em;position:relative;z-index:3;text-shadow:0 3px 0 rgba(255,255,255,.85)}
#splash .sub{font-family:var(--kai);font-style:italic;font-size:clamp(18px,3vw,26px);color:#8C7A83;margin-top:6px;letter-spacing:.14em;position:relative;z-index:3}
#splash .desc{color:var(--ink-dim);margin-top:20px;max-width:440px;font-size:15px;position:relative;z-index:3;line-height:1.9;background:rgba(255,255,255,.72);padding:12px 22px;border-radius:18px;border:1px solid var(--line)}
#splash .enter{margin-top:30px;padding:13px 46px;border-radius:999px;background:var(--pink);color:#fff;font-size:17px;font-weight:700;letter-spacing:.06em;box-shadow:0 8px 26px rgba(232,140,168,.45);transition:.2s;position:relative;z-index:3}
#splash .enter:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 34px rgba(232,140,168,.55)}
#splash .sysline{position:absolute;top:12%;left:50%;transform:translateX(-50%);z-index:3;font-family:var(--pixel);color:#D47592;background:rgba(255,255,255,.7);border:1px solid var(--line2);padding:2px 14px;border-radius:999px;font-size:16px;letter-spacing:.12em}
#splash .hint{position:absolute;bottom:24px;color:var(--ink-faint);font-size:15px;letter-spacing:.1em;z-index:3;font-family:var(--dance)}
#splash .enter.guest{margin-top:14px;background:#fff;color:var(--pink);border:1px solid var(--pink);box-shadow:0 6px 18px rgba(232,140,168,.22)}

/* ===== 密码锁 ===== */
#lockScreen{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:linear-gradient(165deg,#FDE7EE 0%,#FBE0EA 40%,#F7E7F0 75%,#FCEBF0 100%);padding:20px}
#lockScreen.show{display:flex}
.lockcard{background:rgba(255,255,255,.92);border:1px solid var(--line2);border-radius:22px;padding:34px 30px;width:100%;max-width:370px;text-align:center;box-shadow:0 20px 60px rgba(200,140,165,.3)}
.lockcard .lt{font-family:var(--dance);font-size:36px;color:var(--pink);margin-bottom:4px}
.lockcard .lh{font-size:13px;color:var(--ink-dim);margin-bottom:18px;line-height:1.7;min-height:42px}
.lockcard input{width:100%;padding:11px 16px;border-radius:12px;border:1px solid var(--line2);font-size:15px;outline:none;background:#FDF6FA;color:var(--ink);text-align:center;margin-bottom:10px;font-family:inherit}
.lockcard input:focus{border-color:var(--pink)}
.lockcard .ok{background:var(--pink);color:#fff;font-weight:700;padding:10px 36px;border-radius:999px;box-shadow:0 4px 14px rgba(232,140,168,.35)}
.locklinks{margin-top:18px;display:flex;flex-direction:column;gap:9px;font-size:12.5px;color:var(--ink-dim)}
.locklinks a{cursor:pointer;color:var(--ink-dim);letter-spacing:.03em}
.locklinks a:hover{color:var(--pink)}
.daysbig{font-size:32px;font-weight:900;color:var(--pink);margin:6px 0 2px;line-height:1.1}
.daysub{font-size:12px;color:var(--ink-faint)}
.dm-img{height:20px;width:auto;max-width:70px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-left:6px}
.skdetail{background:#FDF0F5;border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px;color:var(--ink-dim)}
.memofilegrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.it-tag{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink)}
.it-tag b{cursor:pointer;color:var(--coral);font-weight:700;margin-left:2px}
.it-tag b:hover{color:#E0557A}

/* ===== 顶栏 ===== */
#topbar{position:sticky;top:0;z-index:40;background:rgba(252,228,236,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#topbar .brand{font-family:var(--dance);font-size:25px;color:var(--pink);white-space:nowrap;cursor:pointer}
.searchwrap{position:relative;flex:1;min-width:170px;max-width:460px}
#search{width:100%;padding:9px 16px 9px 38px;border-radius:999px;background:#fff;border:1px solid var(--line2);color:var(--ink);font-size:14px;outline:none;transition:border .2s,box-shadow .2s;box-shadow:0 2px 8px rgba(200,140,165,.08)}
#search:focus{border-color:var(--pink);box-shadow:0 2px 14px rgba(232,140,168,.2)}
.searchwrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:14px}
#results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--line2);border-radius:14px;box-shadow:0 16px 44px rgba(200,140,165,.2);overflow:hidden;display:none;max-height:360px;overflow-y:auto;z-index:60}
#results.show{display:block}
#results .r{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
#results .r:last-child{border-bottom:none}
#results .r:hover,#results .r.active{background:#FEF4F8}
#results .r .ic{width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
#results .r .nm{font-size:14px;color:var(--ink)}
#results .r .path{font-size:12px;color:var(--ink-dim)}
.navback{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;border:1px solid var(--line2);color:var(--ink-dim);font-size:13px;transition:.2s;background:#fff}
.navback:hover{color:var(--pink);border-color:var(--pink)}
.navroom{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;background:var(--pink);color:#fff;font-size:13px;transition:.2s;box-shadow:0 3px 12px rgba(232,140,168,.4)}
.navroom:hover{transform:translateY(-2px)}

/* ===== 主体 ===== */
#app{display:none;max-width:1060px;margin:0 auto;padding:26px 20px 80px}
#app.show{display:block}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-dim);margin-bottom:22px;flex-wrap:wrap}
.crumbs .sep{color:var(--ink-faint)}
.crumbs .cur{color:var(--pink)}
.crumbs button{font-size:13px;color:var(--ink-dim)}
.crumbs button:hover{color:var(--pink)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.pagehead .colnum{font-size:15px;color:var(--pink);letter-spacing:.16em;text-transform:uppercase}
.pagehead h1{font-size:clamp(30px,4.5vw,42px);color:var(--ink);margin-top:4px;line-height:1.15}
.pagehead p{color:var(--ink-dim);font-size:14px;margin-top:8px;max-width:620px}
.pagehead .stat{text-align:right;font-size:12px;color:var(--ink-faint);line-height:1.9}
.deco{font-family:var(--dance);color:var(--coral);letter-spacing:.16em;text-align:center;margin:14px 0 6px;font-size:23px}

/* 模块卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer;transition:transform .22s,box-shadow .22s;position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(200,140,165,.10)}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(200,140,165,.18)}
.card .topline{position:absolute;top:0;left:0;right:0;height:4px;background:var(--cc)}
.card .body{padding:22px 22px 20px}
.card .emo{font-size:28px;margin-bottom:12px}
.card h3{font-size:23px;color:var(--ink);line-height:1.2}
.card .en{font-family:var(--pixel);font-size:13px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase;margin:4px 0 10px}
.card .bd{font-size:13.5px;color:var(--ink-dim);line-height:1.7}
.card .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.card .badge{font-size:12px;padding:3px 11px;border-radius:999px;background:#FDF0F5;color:var(--ink-dim);border:1px solid var(--line)}
.card .cnt{position:absolute;top:16px;right:16px;font-size:12px;color:var(--ink-faint);background:#FDF0F5;padding:3px 10px;border-radius:999px}

/* 素材墙（拍立得） */
.wallsec{margin-top:40px;padding-top:8px;border-top:1px dashed var(--line2)}
.walltip{text-align:center;color:var(--ink-faint);font-size:12.5px;margin-top:6px}
.polwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:26px;justify-items:center;margin-top:18px}
.polaroid{background:#fff;padding:10px 10px 12px;box-shadow:0 12px 28px rgba(200,140,165,.25);position:relative;transform:rotate(var(--rot,-2deg));transition:transform .25s;border-radius:3px}
.polaroid:hover{transform:rotate(0deg) translateY(-4px) scale(1.04);z-index:2}
.polaroid .ph{position:relative;overflow:hidden;border:1px solid #F6E3EA;background:#FDF0F5}
.polaroid .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--op,50% 30%)}
.polaroid .cap{font-family:var(--dance);color:#B0708C;text-align:center;font-size:16px;margin-top:8px;line-height:1.2}
.tape{position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-3deg);width:74px;height:22px;background:rgba(246,222,168,.88);box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:2;border-radius:2px}
.pol-y2k{width:150px}.pol-y2k .ph{padding-top:133.33%}.pol-y2k img{object-position:50% 46%}
.pol-col{width:150px}.pol-col .ph{padding-top:100%}.pol-col img{object-position:50% 26%}
.pol-nt{width:170px}.pol-nt .ph{padding-top:80%}.pol-nt img{object-position:50% 34%}
.pol-fr{width:170px}.pol-fr .ph{padding-top:80%}.pol-fr img{object-position:50% 36%}

.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.subcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.2s;box-shadow:0 3px 12px rgba(200,140,165,.08)}
.subcard:hover{border-color:var(--cc);transform:translateY(-2px);box-shadow:0 12px 30px rgba(200,140,165,.16)}
.subcard .ic{font-size:24px;margin-bottom:10px}
.subcard h4{font-size:19px;color:var(--ink)}
.subcard .de{font-size:13px;color:var(--ink-dim);margin-top:4px;line-height:1.6}
.subcard .go{margin-top:10px;font-size:13px;color:var(--cc);letter-spacing:.06em}

.detail{display:grid;grid-template-columns:1fr;gap:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 3px 14px rgba(200,140,165,.08)}
.panel .ph{font-family:var(--kai);font-size:22px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:9px;color:var(--ink)}
.panel .ph .ic{font-size:20px}
.panel .pd{font-size:13.5px;color:var(--ink-dim);margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border-radius:14px;overflow:hidden;table-layout:fixed}
th{text-align:left;font-size:11px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);background:#FDF0F5}
td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--ink);word-break:break-word}
tr:hover td{background:#FEF8FB}
.tag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:8px;vertical-align:middle}
.tag.ok{background:var(--mint)}
.tag.mid{background:var(--lemon)}
.featlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.feat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:13.5px;box-shadow:0 2px 8px rgba(200,140,165,.06)}
.feat b{color:var(--cc);display:block;margin-bottom:4px;font-size:15px}
.feat span{color:var(--ink-dim);font-size:12.5px;line-height:1.6;display:block}
.notice{border-left:3px solid var(--pink);background:#FDF0F5;padding:12px 16px;border-radius:0 12px 12px 0;font-size:13px;color:var(--ink-dim);margin-top:14px;line-height:1.7}
.empty{text-align:center;color:var(--ink-faint);padding:22px;font-size:14px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.addbtn{padding:9px 20px;border-radius:999px;background:var(--cc);color:#fff;font-size:13.5px;font-weight:700;box-shadow:0 4px 14px rgba(200,140,165,.25);transition:.2s}
.addbtn:hover{transform:translateY(-2px)}
.delbtn{color:var(--coral);font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid #F0C8D0;transition:.2s}
.delbtn:hover{background:#FDF0F5}

/* ===== 留言板（飘字留言） ===== */
.danmuscreen{position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(180deg,#FFF4F8,#FDEAF1);border:1px solid var(--line2);height:300px;box-shadow:inset 0 0 40px rgba(232,140,168,.12)}
.danmuscreen::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(232,140,168,.12) 1px,transparent 1.2px);background-size:16px 16px;pointer-events:none}
.danmu{position:absolute;top:var(--lane);left:100%;white-space:nowrap;padding:5px 15px;border-radius:999px;font-size:13.5px;color:#5A4A52;background:var(--dbg,#FFF0F5);box-shadow:0 3px 10px rgba(200,140,165,.28);border:1px solid rgba(255,255,255,.85);animation:dmRun var(--dur) linear infinite;animation-delay:var(--dly);z-index:1}
.danmu b{font-weight:700;color:#D47592;margin-right:6px}
@keyframes dmRun{to{transform:translateX(calc(-100% - 820px))}}
.gbwall{display:flex;flex-direction:column;gap:10px;padding:6px 0 4px}
.gbnote{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;box-shadow:0 2px 8px rgba(200,140,165,.06)}
.gbnote .who{color:#D47592;font-weight:700;flex:none}
.gbnote .tx{color:var(--ink);line-height:1.6}
.gbnote .dt{color:var(--ink-faint);font-size:11px;margin-left:auto;flex:none}
.gbform{background:#fff;border:1px solid var(--line2);border-radius:16px;padding:16px;margin-top:16px}
.gbform label{display:block;font-size:13px;color:var(--ink-dim);margin:9px 0 5px}
.gbform input{width:100%;padding:9px 14px;border-radius:10px;border:1px solid var(--line2);font-size:14px;outline:none;background:#FDF6FA}
.gbform input:focus{border-color:var(--pink)}
.gbfire{margin-top:14px;padding:10px 30px;border-radius:999px;background:var(--pink);color:#fff;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(232,140,168,.35)}
.gbfire:hover{transform:translateY(-2px)}

/* 图表容器 */
.chartrow{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chartbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.chartbox h5{font-size:15px;color:var(--ink);margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.kpi .v{font-size:20px;font-weight:700;color:var(--pink)}
.kpi .l{font-size:12px;color:var(--ink-faint);margin-top:4px}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{padding:7px 18px;border-radius:999px;border:1px solid var(--line2);font-size:13px;color:var(--ink-dim);background:#fff}
.seg button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:12px;color:var(--ink-dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}

/* 时间轴（日程/学习计划） */
.timeline{position:relative;padding-left:26px;margin:6px 0}
.timeline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tlitem{position:relative;padding:8px 0 14px}
.tlitem::before{content:'';position:absolute;left:-22px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--cc);border:2px solid #fff;box-shadow:0 0 0 2px var(--line2)}
.tlitem .tt{font-size:13px;font-weight:700;color:var(--pink);letter-spacing:.02em}
.tlitem .dur{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#FDF0F5;color:var(--ink-dim);margin-left:6px;border:1px solid var(--line)}
.tlitem .tx{font-size:14px;color:var(--ink);margin-top:2px}
.tlitem .pri{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin-left:6px}
.pri.important{background:#F6DFA8;color:#8A6D20}
.pri.normal{background:#B7D8C8;color:#3E7A5C}
.pri.easy{background:#CDBBE6;color:#5A46A0}
.pri.del{margin-left:8px;padding:2px 8px;border-radius:999px;border:1px solid #F0C8D0;color:var(--coral);font-size:11px;cursor:pointer;background:#fff}
.pri.del:hover{background:#FDF0F5}
.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12px}
.monthgrid .day{padding:6px 4px;border-radius:10px;background:#fff;border:1px solid var(--line);min-height:40px;cursor:pointer;text-align:center;transition:.15s}
.monthgrid .day:hover{border-color:var(--pink);background:#FDF0F5}
.monthgrid .day .dnum{color:var(--ink-dim)}
.monthgrid .day .dots{font-size:10px;color:var(--pink);margin-top:2px}
.monthgrid .day.blank{background:transparent;border:none;cursor:default}
.yeargrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;font-size:12px}
.yeargrid .mon{padding:10px 6px;border-radius:12px;background:#fff;border:1px solid var(--line);cursor:pointer;text-align:center;transition:.15s}
.yeargrid .mon:hover{border-color:var(--pink);background:#FDF0F5}
.yeargrid .mon b{display:block;font-size:14px;color:var(--ink);margin-bottom:4px}
.yeargrid .mon .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.yeargrid .mon .bar i{display:block;height:100%;background:var(--pink)}

/* 学习计划 */
.planstat{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.planstat .ps{flex:1;min-width:110px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.planstat .ps b{display:block;font-size:19px;color:var(--pink)}
.planstat .ps span{font-size:12px;color:var(--ink-faint)}
.planitem{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line)}
.planitem:last-child{border-bottom:none}
.planitem .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--pink);flex:none;margin-top:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;background:#fff;transition:.15s}
.planitem.done .ck{background:var(--mint);border-color:var(--mint)}
.planitem .pt{flex:1}
.planitem .pt .ptt{font-size:14.5px;color:var(--ink)}
.planitem .pt .ptd{font-size:12px;color:var(--ink-faint);margin-top:2px}
.planitem.done .ptt{text-decoration:line-through;color:var(--ink-faint)}
.planitem .pdel{color:var(--coral);font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid #F0C8D0}

/* 便签墙（摘抄/感悟） */
.tabbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabbar button{padding:8px 20px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink-dim);font-size:13.5px;transition:.15s}
.tabbar button.on{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:0 4px 14px rgba(232,140,168,.35)}
.quotewall{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:20px}
.note{position:relative;background:linear-gradient(180deg,#FFFDF7,#FFF7E6);border-radius:4px 14px 14px 14px;box-shadow:0 8px 20px rgba(200,140,165,.18);padding:18px 16px 14px;transform:rotate(var(--rot,0deg));border:1px solid #F8E8CE}
.note::before{content:'';position:absolute;top:-10px;left:16px;width:54px;height:19px;background:rgba(246,222,168,.92);box-shadow:0 2px 5px rgba(0,0,0,.07);transform:rotate(-4deg);border-radius:2px}
.note .q{font-size:15px;color:#6B5460;line-height:1.85;white-space:pre-wrap}
.note .from{font-size:12px;color:#C08AA0;margin-top:9px}
.note .nimg{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.note .nimg img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.12);cursor:pointer}
.note .nimg .box{border:2px dashed var(--line2);border-radius:8px;width:84px;height:84px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:22px;cursor:pointer;background:#FFFDF7}
.note .ndel{position:absolute;top:12px;right:12px;color:var(--coral);font-size:12px;padding:2px 7px;border-radius:999px;border:1px solid #F0C8D0;background:#fff;cursor:pointer}
.note .nimg .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.nimg{position:relative}

/* 成就贴纸墙 */
.achwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px}
.sticker{background:#fff;border-radius:16px;padding:20px 18px 16px;position:relative;box-shadow:0 10px 24px rgba(200,140,165,.18);transform:rotate(var(--rot,0deg));border:1px solid var(--line);transition:transform .2s}
.sticker:hover{transform:rotate(0deg) translateY(-3px)}
.sticker .star{position:absolute;top:-15px;right:14px;font-size:30px;transform:rotate(16deg);color:#F6C453;text-shadow:0 2px 6px rgba(246,196,83,.5)}
.sticker .an{font-size:17px;font-weight:700;color:var(--ink);line-height:1.35}
.sticker .ad{font-size:12px;color:var(--ink-faint);margin-top:3px}
.sticker .anote{font-size:13px;color:var(--ink-dim);margin-top:8px;line-height:1.6;white-space:pre-wrap}
.sticker .adel{position:absolute;bottom:10px;right:12px;color:var(--coral);font-size:12px;cursor:pointer;border:1px solid #F0C8D0;padding:1px 8px;border-radius:999px;background:#fff}

/* 习惯打卡 */
.habitchip{display:inline-block;padding:2px 12px;border-radius:999px;color:#fff;font-size:12px;font-weight:700}
.minical{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;margin-top:10px}
.minical .hd{text-align:center;color:var(--ink-faint);padding:2px 0}
.minical .d{height:27px;border-radius:7px;background:#FDF0F5;display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
.minical .d.done{background:var(--mint);color:#fff;font-weight:700}
.minical .d.today{outline:2px solid var(--pink);outline-offset:1px}
.minical .d.blank{background:transparent}
.hlog{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.hlog:last-child{border-bottom:none}
.hlog .hdt{color:var(--ink-faint);flex:none;font-size:12px;margin-top:2px}
.hlog .htx{color:var(--ink-dim);flex:1;line-height:1.5}
.hlog img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer;flex:none}
.hlog .hdel{color:var(--coral);font-size:12px;cursor:pointer;flex:none;border:1px solid #F0C8D0;padding:1px 7px;border-radius:999px;background:#fff}

/* 新增表单弹窗 */
.formmodal{position:fixed;inset:0;z-index:80;background:rgba(90,70,80,.4);display:none;align-items:center;justify-content:center;padding:20px}
.formmodal.show{display:flex}
.formcard{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:430px;box-shadow:0 20px 60px rgba(90,70,80,.3);transform:translateY(8px);transition:transform .25s;max-height:90vh;overflow-y:auto}
.formmodal.show .formcard{transform:translateY(0)}
.formcard h3{font-size:21px;margin-bottom:4px;color:var(--ink)}
.formcard .fd{font-size:13px;color:var(--ink-faint);margin-bottom:14px}
.formcard label{display:block;font-size:13px;color:var(--ink-dim);margin:10px 0 5px}
.formcard input,.formcard select,.formcard textarea{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line2);font-size:14px;outline:none;background:#FDF6FA}
.formcard input:focus,.formcard select:focus,.formcard textarea:focus{border-color:var(--pink)}
.formrow{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.formrow button{padding:9px 22px;border-radius:999px;font-size:14px}
.formrow .ok{background:var(--pink);color:#fff;font-weight:700}
.formrow .no{background:#F5EDF0;color:var(--ink-dim)}
/* ---- 备忘录 / 菜谱 / 网址 / 睡眠 / 喝水 / 便便 / 周月计划 ---- */
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:#FDF0F4;color:#C96A8A;font-size:12px;border:1px solid #F6D5E0;white-space:nowrap}
.recipelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:6px}
.recipecard{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:14px 16px;box-shadow:0 3px 10px rgba(200,150,165,.08)}
.recsec{display:flex;gap:10px;margin-top:8px;font-size:13px;color:var(--ink-dim);line-height:1.7;align-items:flex-start}
.recsec .rl{flex:0 0 auto;color:var(--cc);font-weight:700;background:#FDF0F4;border-radius:8px;padding:2px 8px;font-size:12px}
.bmcard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line2);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.bmcard a{display:flex;align-items:center;gap:12px;flex:1;min-width:0;color:inherit;text-decoration:none}
.bmic{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#FFD9E6,#F6C4D8);color:#C96A8A;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:0 0 auto}
.bmt{min-width:0}
.bmt b{display:block;font-size:14.5px;color:var(--ink)}
.bmu{display:block;font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtabbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.wtab{padding:9px 22px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink-dim);font-size:14px;cursor:pointer}
.wtab.active{background:var(--pink);color:#fff;border-color:var(--pink);font-weight:700}
.weekpick{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 16px}
.weekpick label{font-size:13px;color:var(--ink-dim)}
.weekpick input{border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:14px;background:#FDF6FA;color:var(--ink)}
.wrange{font-size:12.5px;color:var(--ink-faint)}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.daycol{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.daycol.today{border-color:var(--pink);box-shadow:0 0 0 2px rgba(232,140,168,.15)}
.dayname{font-size:13px;font-weight:700;color:var(--cc)}
.dayname .dnum{display:block;font-size:11px;color:var(--ink-faint);font-weight:400}
.daytasks{display:flex;flex-direction:column;gap:5px;min-height:36px}
.wtask{display:flex;align-items:center;gap:6px;background:#FDF6FA;border-radius:9px;padding:5px 7px;font-size:12.5px}
.wtask.done .wtx{text-decoration:line-through;color:var(--ink-faint)}
.wtcheck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);background:#fff;color:#fff;font-size:11px;line-height:1;flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.wtask.done .wtcheck,.goalrow.done .wtcheck{background:var(--pink);border-color:var(--pink)}
.wtx{flex:1;min-width:0;overflow-wrap:break-word}
.wempty{color:#E8C9D5;font-size:11.5px;text-align:center}
.wtadd{width:100%;padding:6px;border-radius:9px;border:1px dashed var(--line2);background:transparent;color:var(--ink-faint);font-size:12px;cursor:pointer}
.wtadd:hover{border-color:var(--pink);color:var(--pink)}
.monthgoals{display:flex;flex-direction:column;gap:10px}
.goalrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:10px 14px;flex-wrap:wrap}
.goalrow .gx{flex:1;font-size:14px;color:var(--ink);min-width:120px}
.goalrow .gn{font-size:12px;color:var(--ink-faint)}
.goalrow.done .gx{text-decoration:line-through;color:var(--ink-faint)}
.progbar{height:10px;border-radius:999px;background:#F6E3EA;overflow:hidden;margin:14px 0 6px}
.progbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#F9A8C0,#E88CA8);transition:width .4s}
.waterbig{display:flex;align-items:baseline;gap:10px;justify-content:center;padding:8px 0 2px}
.waterbig .wcount{font-size:64px;font-weight:900;color:var(--pink);font-family:var(--font-hand)}
.waterbig .wunit{font-size:16px;color:var(--ink-dim)}
@media(max-width:760px){.weekgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.recipelist{grid-template-columns:1fr}}

@media (max-width:700px){
  #topbar{padding:10px 14px}
  .searchwrap{order:3;flex-basis:100%}
  .pagehead{flex-direction:column;align-items:flex-start}
  .pagehead .stat{text-align:left}
  .chartrow{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .danmuscreen{height:220px}
  #spPolaroid{width:30vw;top:1.5%;right:1.5%}
  #spWin{width:30vw;bottom:0.5%;left:0.5%;transform:rotate(-3deg)}
  #splash .sysline{top:8%;font-size:14px}
  #splash .room{margin-top:10px}
  input,textarea,select{font-size:16px!important}
}
@media (prefers-reduced-motion: reduce){
  .danmu{animation:none;position:relative;left:0;display:block;margin:6px 0;width:max-content;max-width:100%;white-space:normal}
}

/* ---------- 体围 / 附件 / 心情 / 课表 ---------- */
.measureform{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.measureform .mf label{display:block;font-size:13px;color:var(--ink-dim);margin-bottom:4px}
.measureform .mf input{width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--line2);font-size:14px;outline:none;background:#FDF6FA}
.measureform .mf input:focus{border-color:var(--pink)}
.upbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;background:#fff;border:1px dashed var(--pink);color:var(--pink);font-size:13px;cursor:pointer;transition:.2s}
.upbtn:hover{background:#FDF0F5}
.attachgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:10px}
.attachimg{border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer;position:relative;background:#fff}
.attachimg img{width:100%;height:90px;object-fit:cover}
.attachimg .del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.attachdoc{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:#FDF6FA;border:1px solid var(--line);font-size:13px;cursor:pointer;position:relative;color:var(--ink)}
.attachdoc .del{position:absolute;top:4px;right:6px;font-size:12px;color:var(--coral);cursor:pointer}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:92%;max-height:92%;border-radius:8px}
.moodwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.moodcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;position:relative}
.moodcard .em{font-size:26px}
.moodcard .mood{font-size:14px;font-weight:700;color:var(--ink);margin-top:4px}
.moodcard .dt{font-size:12px;color:var(--ink-faint);margin-top:2px}
.moodcard .note{font-size:12px;color:var(--ink-dim);margin-top:6px;line-height:1.5}
.moodcard .del{position:absolute;top:6px;right:8px;font-size:13px;color:var(--coral);cursor:pointer}
.moodgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12px;margin-bottom:14px}
.moodgrid .d{padding:8px 4px;border-radius:10px;background:#fff;border:1px solid var(--line);text-align:center;cursor:pointer;transition:.15s;min-height:48px}
.moodgrid .d:hover{border-color:var(--pink);background:#FDF0F5}
.moodgrid .d.blank{background:transparent;border:none;cursor:default}
.moodgrid .d .em{font-size:16px}
.timetable{width:100%;border-collapse:separate;border-spacing:6px;font-size:13px;table-layout:auto}
.timetable th{background:#FDF0F5;padding:8px;border-radius:8px;text-align:center;font-size:12px;color:var(--ink-dim)}
.timetable td{background:#fff;border-radius:8px;vertical-align:top;min-height:60px;padding:4px}
.timetable .slot{font-size:11px;color:var(--ink-faint);text-align:center;padding:6px 0}
.tt-item{background:var(--cc,#E88CA8);color:#fff;border-radius:8px;padding:6px 8px;font-size:12px;margin-bottom:5px;position:relative}
.tt-item b{display:block;font-size:13px}
.tt-item .del{position:absolute;top:2px;right:6px;font-size:11px;color:rgba(255,255,255,.85);cursor:pointer}

/* ===== 新增功能样式 ===== */
.quickrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin:12px 0 18px}
.quickcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.2s;box-shadow:0 2px 8px rgba(200,140,165,.06);text-align:center}
.quickcard:hover{transform:translateY(-2px);border-color:var(--pink);box-shadow:0 6px 18px rgba(200,140,168,.15)}
.quickcard .qi{font-size:22px;margin-bottom:4px}
.quickcard .qn{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px}
.quickcard .qd{font-size:10.5px;color:var(--ink-dim)}
.monthview{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12px;margin:12px 0}
.monthview .mh{display:flex;justify-content:center;color:var(--ink-faint);font-size:11px;padding:4px 0}
.monthview .md{min-height:52px;border-radius:10px;background:#fff;border:1px solid var(--line);padding:4px;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.monthview .md:hover{border-color:var(--pink);background:#FDF0F5}
.monthview .md .dn{font-size:12px;color:var(--ink-dim);font-weight:600}
.monthview .md .dv{font-size:10px;color:var(--ink-faint);margin-top:2px;overflow:hidden}
.monthview .md.today{border-color:var(--pink);box-shadow:0 0 0 2px rgba(232,140,168,.15)}
.monthview .md.done{background:#F0F7F2;border-color:#A9CDB8}
.monthview .md.done .dn{color:#3E7D5A;font-weight:700}
.monthview .md.blank{background:transparent;border:none;cursor:default}
.monthview .md .dot{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}
.monthview .md .dot span{width:6px;height:6px;border-radius:50%;display:inline-block}
.yearview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:13px}
.yearview .ym{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.yearview .ym b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}
.yearview .ym .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.yearview .ym .bar i{display:block;height:100%;border-radius:4px;background:var(--pink)}
.folderlist{display:flex;flex-direction:column;gap:10px}
.folder{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s}
.folder:hover{border-color:var(--pink)}
.folder .fname{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink)}
.folder .fcount{font-size:12px;color:var(--ink-faint)}
.folder .fitems{margin-top:10px;padding-left:20px}
.timerbox{text-align:center;padding:30px 20px}
.timerbox .time{font-size:72px;font-weight:900;color:var(--pink);font-family:var(--pixel);letter-spacing:.05em;margin:20px 0}
.timerbox .task{font-size:18px;color:var(--ink);margin-bottom:16px}
.timerbox .controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.timerbox .controls button{padding:12px 28px;border-radius:999px;font-size:15px;font-weight:700}
.timerbox .controls .start{background:var(--pink);color:#fff;box-shadow:0 4px 14px rgba(232,140,168,.4)}
.timerbox .controls .stop{background:#F6DFA8;color:#8A6D20}
.timerbox .controls .reset{background:#FDF0F5;color:var(--ink-dim)}
.timerbox .settings{margin-top:20px;display:flex;gap:12px;justify-content:center;align-items:center}
.timerbox .settings label{font-size:13px;color:var(--ink-dim)}
.timerbox .settings input{width:80px;padding:6px 10px;border-radius:8px;border:1px solid var(--line2);text-align:center;font-size:14px}
.timeline-v{position:relative;padding-left:30px;margin:16px 0}
.timeline-v::before{content:'';position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--line2)}

function storeKey(mid,sid){return PREFIX+mid+'_'+sid}
function findModule(id){return DATA.find(m=>m.id===id)}
function findSub(mid,sid){const m=findModule(mid);return m?m.sub.find(s=>s.id===sid):null}
function loadRows(mid,sid){
  const def=findSub(mid,sid); if(!def)return [];
  try{const raw=localStorage.getItem(storeKey(mid,sid));if(raw!==null)return JSON.parse(raw);}catch(e){}
  return [];
}

function loadRead(k,dft){try{const raw=localStorage.getItem(PREFIX+k);if(raw!==null)return JSON.parse(raw);}catch(e){}return [];}
function saveRead(k,list){try{localStorage.setItem(PREFIX+k,JSON.stringify(list));}catch(e){}}
function countRows(mid){
  const m=findModule(mid);if(!m)return 0;
  return m.sub.reduce((n,s)=>{
    if(s.special==='reading')return n+loadRead('read_books',[]).length+loadRead('read_quotes',[]).length+loadRead('read_notes',[]).length;
    if(s.special==='habit')return n+loadHabits().length;
    if(s.special==='skill')return n+loadSkillItems(s.id==='lang'?'lang':'skill').length;
    if(s.special==='plan'){const p=loadStudyPlan();return n+Object.values(p).reduce((a,l)=>a+l.length,0);}
    if(s.special==='weekmonth'){const w=loadWeekTasks(),m=loadMonthGoals();return n+Object.values(w).reduce((a,d)=>a+Object.values(d).reduce((x,l)=>x+l.length,0),0)+Object.values(m).reduce((a,l)=>a+l.length,0);}
    return n+loadRows(mid,s.id).length;
  },0);
}

function streakOf(logs,today){
  let streak=0,d=new Date(today);
  for(let i=0;i<400;i++){
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(logs.some(l=>l.date===key)){streak++;d.setDate(d.getDate()-1);}
    else break;
  }
  return streak;
}

/* 图表：柱状图 */
function barChart(inc,exp,labels){
  const max=Math.max(...inc,...exp)*1.15;
  const w=360,h=200;
  const bw=w/(labels.length*2+1);
  let bars='';
  labels.forEach((lb,i)=>{
    const x1=bw*(i*2+0.4), x2=bw*(i*2+1.15);
    const h1=inc[i]/max*h, h2=exp[i]/max*h;
    bars+=`
      <rect x="${x1}" y="${h-h1}" width="${bw*0.55}" height="${h1}" rx="4" fill="#E88CA8" opacity=".85"><title>${lb} 收入 ${inc[i]}</title></rect>
      <rect x="${x2}" y="${h-h2}" width="${bw*0.55}" height="${h2}" rx="4" fill="#B7D8C8" opacity=".9"><title>${lb} 支出 ${exp[i]}</title></rect>
      <text x="${x1+bw*0.55/2}" y="${h+14}" font-size="9" text-anchor="middle" fill="#8C7A83">${lb}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h+24}" style="width:100%;max-width:420px">${bars}<text x="6" y="14" font-size="10" fill="#B9A6AE">单位：元</text></svg>
  <div class="legend"><span><i style="background:#E88CA8"></i>收入</span><span><i style="background:#B7D8C8"></i>支出</span></div>`;
}
/* 图表：环形图 */
function donutChart(data){
  let acc=0,segs='';
  const r=70,cx=90,cy=90,circ=2*Math.PI*r;
  data.forEach(d=>{
    const frac=d[1]/100, len=frac*circ;
    const off=acc*circ; acc+=frac;
    segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d[2]}" stroke-width="24" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"><title>${d[0]} ${d[1]}%</title></circle>`;
  });
  return `<svg viewBox="0 0 180 180" style="width:100%;max-width:220px"><circle cx="${cx}" cy="${cy}" r="48" fill="none" stroke="#F6E3EA" stroke-width="1"></circle>${segs}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="14" font-weight="700" fill="#5A4A52">支出</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10" fill="#B9A6AE">分类占比</text></svg>
  <div class="legend">${data.map(d=>`<span><i style="background:${d[2]}"></i>${d[0]} ${d[1]}%</span>`).join('')}</div>`;
}

/* 资金月年统计：基于真实收支数据 + 收支月历 */
function renderStats(mid){
  const m=findModule(mid);
  state.module=mid;state.sub='stats';state.guest=false;state.sched=null;
  const rows=loadRows('money','flow');
  const dayMap=buildFlowDayMap(rows);
  if(!state.statsMonth){const n=new Date();state.statsMonth=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');}
  const fy=+state.statsMonth.split('-')[0],fm=+state.statsMonth.split('-')[1];
  const prefix=state.statsMonth;
  const monthStat=flowMonthStat(dayMap,prefix);
  const monthInc=monthStat.inc,monthExp=monthStat.exp,monthCnt=monthStat.cnt;

  /* 收支月历 */
  const first=new Date(fy,fm-1,1).getDay();
  const daysInMonth=new Date(fy,fm,0).getDate();
  const today=nowStr();
  let cells='';
  ['一','二','三','四','五','六','日'].forEach(h=>cells+=`<div class="mh">${h}</div>`);
  for(let i=0;i<first;i++)cells+=`<div class="md blank"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${fy}-${String(fm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dm=dayMap[ds];
    const tip=dm?((((dm.inc?'收入 ¥'+dm.inc.toFixed(2)+'  ':'')+(dm.exp?'支出 ¥'+dm.exp.toFixed(2):''))||'无记录')):'无记录';
    cells+=`<div class="md ${ds===today?'today':''}" data-stday="${ds}" title="${tip}">
      <div class="dn">${d}</div>
      ${dm&&dm.inc?`<div class="dv" style="color:var(--mint)">+${dm.inc.toFixed(0)}</div>`:''}
      ${dm&&dm.exp?`<div class="dv" style="color:var(--coral)">-${dm.exp.toFixed(0)}</div>`:''}
    </div>`;
  }
  const selDay=state.statsDay&&state.statsDay.startsWith(prefix)?state.statsDay:null;
  const selItems=selDay?(dayMap[selDay]?dayMap[selDay].items:[]):[];
  const dayDetailHTML=selDay?`
    <div style="margin-top:12px;padding:12px 14px;background:#FDF0F5;border:1px solid var(--line);border-radius:12px">
      <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px">📅 ${selDay} 收支明细（${selItems.length} 笔）</div>
      ${selItems.length?selItems.map(it=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)">
        <span>${esc(it.cat)||'未分类'}</span><span style="${it.type==='income'?'color:var(--mint)':'color:var(--coral)'}">${it.type==='income'?'+':'-'}¥${it.amount.toFixed(2)}</span></div>`).join('')
        :'<div style="font-size:12.5px;color:var(--ink-faint)">该日暂无收支记录</div>'}
      <button class="delbtn" data-stdayclear style="margin-top:8px;font-size:12px">收起</button>
    </div>`:'';

  /* 近6个月柱状图 */
  const labels=[],incBars=[],expBars=[];
  for(let i=5;i>=0;i--){
    const dt=new Date(fy,fm-1-i,1);
    const p=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
    const st=flowMonthStat(dayMap,p);
    labels.push((dt.getMonth()+1)+'月');incBars.push(+st.inc.toFixed(2));expBars.push(+st.exp.toFixed(2));
  }

  /* 本月支出分类占比 */
  const catAgg={};
  Object.keys(dayMap).forEach(d=>{if(d.startsWith(prefix)){dayMap[d].items.forEach(it=>{if(it.type==='expense')catAgg[it.cat]=(catAgg[it.cat]||0)+it.amount;});}});
  const catTotal=Object.values(catAgg).reduce((a,b)=>a+b,0)||1;
  const CAT_COLORS=['#E88CA8','#F09A9A','#B7D8C8','#F6DFA8','#CDBBE6','#9FB8C8','#F2A0C0','#A8C8E8'];
  const catData=Object.keys(catAgg).map((c,i)=>[c,Math.round(catAgg[c]/catTotal*100),CAT_COLORS[i%CAT_COLORS.length]]);
  const donutHTML=catData.length?donutChart(catData):'<div class="empty">本月暂无支出，记一笔吧</div>';

  /* 年度概览 */
  let yInc=0,yExp=0;
  Object.keys(dayMap).forEach(d=>{if(d.startsWith(String(fy))){yInc+=dayMap[d].inc;yExp+=dayMap[d].exp;}});
  const ySave=yInc-yExp,saveRate=yInc?Math.round(ySave/yInc*100):0;
  const yTotal=yInc+yExp||1;
  let yearCells='';
  for(let i=1;i<=12;i++){
    const p=`${fy}-${String(i).padStart(2,'0')}`;
    const st=flowMonthStat(dayMap,p);
    const tot=st.inc+st.exp;
    yearCells+=`<div class="ym"><b>${i}月</b><div class="bar"><i style="width:${Math.min(100,tot/yTotal*100)}%"></i></div><div style="font-size:11px;color:var(--ink-faint);margin-top:4px">收${st.inc.toFixed(0)}/支${st.exp.toFixed(0)}</div></div>`;
  }

  view.innerHTML=`
    <nav class="crumbs"><button data-nav="home">Back to Room</button><span class="sep">/</span><button data-nav="module-money">资金管理</button><span class="sep">/</span><span class="cur">月年统计</span></nav>
    <div class="pagehead">
      <div><div class="colnum">FINANCE · STATS</div><h1>📈 月年统计</h1><p>收支月历 + 月度趋势 + 分类占比 + 年度概览，全部来自你的真实流水。</p></div>
      <div class="stat">${fy} 年<br>收入 ¥${yInc.toFixed(0)} / 支出 ¥${yExp.toFixed(0)}</div>
    </div>
    <div class="deco">✦ 资金可视化 ✦</div>
    <div class="detail">
      <div class="panel" style="--cc:#F09A9A">
        <div class="toolbar">
          <div class="ph"><span class="ic">📊</span> 本月概览 (${fy}年${fm}月)</div>
          <div class="ic-monthnav">
            <button class="prev-month" data-stprev>◀ 上月</button>
            <span>${fy}年${fm}月</span>
            <button class="next-month" data-stnext>下月 ▶</button>
          </div>
        </div>
        <div class="kpis">
          <div class="kpi"><div class="v" style="color:var(--mint)">${monthInc?'¥'+monthInc.toFixed(2):'¥0'}</div><div class="l">本月收入</div></div>
          <div class="kpi"><div class="v" style="color:var(--coral)">${monthExp?'¥'+monthExp.toFixed(2):'¥0'}</div><div class="l">本月支出</div></div>
          <div class="kpi"><div class="v">${(monthInc-monthExp)>=0?'+':''}¥${(monthInc-monthExp).toFixed(2)}</div><div class="l">本月结余</div></div>
          <div class="kpi"><div class="v">${monthCnt}</div><div class="l">本月笔数</div></div>
        </div>
      </div>
      <div class="panel" style="--cc:#F09A9A">
        <div class="ph"><span class="ic">📅</span> ${fy}年${fm}月 收支月历</div>
        <div class="pd">每一天的收入与支出都标注在日历上，点击某一天可查看当天明细。</div>
        <div class="monthview">${cells}</div>
        <div class="flowlegend"><span><i style="background:var(--mint)"></i>收入</span><span><i style="background:var(--coral)"></i>支出</span></div>
        ${dayDetailHTML}
      </div>
      <div class="panel" style="--cc:#F09A9A">
        <div class="ph"><span class="ic">📊</span> 近 6 个月收支柱状图</div>
        <div class="pd">收入与支出随月份的变化趋势。</div>
        ${barChart(incBars,expBars,labels)}
      </div>
      <div class="panel" style="--cc:#F09A9A">
        <div class="ph"><span class="ic">🥧</span> ${fy}年${fm}月 支出分类占比</div>
        <div class="pd">本月支出按分类的占比（环形图）。</div>
        ${donutHTML}
      </div>
      <div class="panel" style="--cc:#F09A9A">
        <div class="ph"><span class="ic">📅</span> ${fy} 年度概览</div>
        <div class="pd">${fy} 年度收支汇总与每月收支分布。</div>
        <div class="kpis">
          <div class="kpi"><div class="v">¥${yInc.toFixed(2)}</div><div class="l">年收入</div></div>
          <div class="kpi"><div class="v">¥${yExp.toFixed(2)}</div><div class="l">年支出</div></div>
          <div class="kpi"><div class="v">${ySave>=0?'+':''}¥${ySave.toFixed(2)}</div><div class="l">年结余</div></div>
          <div class="kpi"><div class="v">${saveRate}%</div><div class="l">储蓄率</div></div>
        </div>
        <div class="yeargrid">${yearCells}</div>
        <button class="qa" data-nav="module-money">← 返回资金管理</button>
      </div>
    </div>`;

  document.querySelector('[data-stprev]')?.addEventListener('click',()=>{
    state.statsMonth = fm===1?(fy-1)+'-12':fy+'-'+String(fm-1).padStart(2,'0');
    state.statsDay=null;renderStats(mid);
  });
  document.querySelector('[data-stnext]')?.addEventListener('click',()=>{
    state.statsMonth = fm===12?(fy+1)+'-01':fy+'-'+String(fm+1).padStart(2,'0');
    state.statsDay=null;renderStats(mid);
  });
  document.querySelector('[data-stdayclear]')?.addEventListener('click',()=>{state.statsDay=null;renderStats(mid);});
  document.querySelectorAll('[data-stday]').forEach(cell=>cell.addEventListener('click',()=>{
    state.statsDay=cell.dataset.stday;renderStats(mid);
  }));
}

/* 日程安排：时间点 + 时间段 */
function renderSchedule(mid){
  const sched=loadSched();
  const today=nowStr();
  const selDay=state.sched||today;
  state.module=mid;state.sub='schedule';state.guest=false;
  const items=getDayItems(sched,selDay).slice().sort((a,b)=>(a.t||'--:--').localeCompare(b.t||'--:--'));
  const now=new Date();
  const y=now.getFullYear(),m=now.getMonth();
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<first;i++)cells+=`<div class="day blank"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cnt=getDayItems(sched,ds).length;
    cells+=`<div class="day" data-sday="${ds}"><div class="dnum">${d}</div><div class="dots">${cnt?'●'.repeat(Math.min(cnt,3)):''}</div></div>`;
  }
  const monthDays=[31,28,31,30,31,30,31,31,30,31,30,31];
  let yearBars='';
  ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'].forEach((mn,idx)=>{
    const md=monthDays[idx];
    const cnt=getDayItems(sched,`${y}-${String(idx+1).padStart(2,'0')}-01`).length;
    const pct=md?Math.min(cnt/md*100,100):0;
    yearBars+=`<div class="mon"><b>${mn}</b><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  });
  // iCalendar style time grid
  const hours=['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00'];
  const dayNames=['周一','周二','周三','周四','周五','周六','周日'];
  let icalHTML=`<div class="ic-monthnav"><button class="prev-month">◀ 上月</button><span>${y}年${m+1}月</span><button class="next-month">下月 ▶</button></div>`;
  // Time grid view
  icalHTML+=`<div style="margin-bottom:16px"><h4 style="font-size:15px;color:var(--ink);margin-bottom:10px">📅 日程时间轴 (${selDay})</h4>`;
  icalHTML+=`<div class="ic-layout"><div class="ic-timecol">`;
  hours.forEach(h=>{icalHTML+=`<div>${h}</div>`;});
  icalHTML+=`</div><div class="ic-daycol">`;
  // Show items for selected day in time slots
  if(items.length){
    items.forEach(it=>{
      icalHTML+=`<div class="ic-event" style="border-left-color:${priCls(it.pri)||'var(--pink)'}">
        <div class="et">${esc(it.n)}</div>
        <div class="eh">${esc(it.t)}${it.e?' - '+esc(it.e):''}</div>
        <div class="ed">${esc(it.d||'')}</div>
      </div>`;
    });
  } else {
    icalHTML+=`<div style="color:var(--ink-faint);font-size:13px;text-align:center;padding:20px">今天暂无日程安排</div>`;
  }
  icalHTML+=`</div></div>`;
  // Calendar grid
  icalHTML+=`<div style="margin-top:20px"><h4 style="font-size:15px;color:var(--ink);margin-bottom:10px">🗓 月份视图</h4><div class="monthgrid">${cells}</div></div>`;
  // Year overview
  icalHTML+=`<div style="margin-top:20px"><h4 style="font-size:15px;color:var(--ink);margin-bottom:10px">📊 年度概览</h4><div class="yeargrid">${yearBars}</div></div>`;
  // Day selector
  icalHTML+=`<div style="margin-top:16px"><label style="font-size:13px;color:var(--ink-dim)">选择日期：</label><input type="date" id="schedDayPicker" value="${selDay}" style="border:1px solid var(--line2);border-radius:10px;padding:6px 12px;font-family:inherit"></div>`;
  
  view.innerHTML=`    <nav class="crumbs"><button data-nav="home">Back to Room</button><span class="sep">/</span><button data-nav="module-utility">实用功能</button><span class="sep">/</span><span class="cur">日程安排</span></nav>    <div class="pagehead">      <div><div class="colnum">UTILITY · SCHEDULE</div><h1>🗓 日程安排</h1><p>iCalendar 风格日程管理，时间轴 + 月视图 + 年概览。</p></div>      <div class="stat">${items.length} 条今日日程</div>    </div>    <div class="deco">✦ 时间管理 ✦</div>    <div class="detail">      <div class="panel" style="--cc:#9FB8C8">        <div class="toolbar"><div class="ph"><span class="ic">🗓</span> iCalendar 视图</div><button class="addbtn" id="openSchedForm" style="--cc:#9FB8C8">＋ 新增日程</button></div>        <div class="pd">不同事件用不同颜色标记，时间颗粒度清晰可见。</div>        ${icalHTML}      </div>    </div>`;
  
  // Bind day picker
  const dayPicker=document.getElementById('schedDayPicker');
  if(dayPicker){
    dayPicker.addEventListener('change',function(){
      state.sched=this.value;
      renderSchedule(mid);
    });
  }
  // Bind month navigation
  document.querySelector('.prev-month')?.addEventListener('click',function(){
    // Simplified: just re-render
    renderSchedule(mid);
  });
  document.querySelector('.next-month')?.addEventListener('click',function(){
    renderSchedule(mid);
  });
  // Bind openSchedForm
  document.getElementById('openSchedForm')?.addEventListener('click',function(){
    openSchedForm();
  });
}const BODY_FIELDS = ["上胸围","下胸围","腰","臀","大腿","小腿"];

      </div>

        <svg viewBox="0 0 180 180" style="width:100%;max-width:210px"><circle cx="${CX}" cy="${CY}" r="46" fill="none" stroke="#F6E3EA" stroke-width="1"></circle>${segs||`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#F6E3EA" stroke-width="22"></circle>`}<text x="${CX}" y="${CY-2}" text-anchor="middle" font-size="13" font-weight="700" fill="#5A4A52">本月</text><text x="${CX}" y="${CY+13}" text-anchor="middle" font-size="10" fill="#B9A6AE">情绪占比</text></svg>

      </div>

function renderHabit(mid,sid){
  const m=findModule(mid),s=findSub(mid,sid);if(!m||!s)return renderModule(mid);
  state.module=mid;state.sub=sid;state.guest=false;state.sched=null;
  const habits=loadHabits(),logs=loadHabitLogs(),today=nowStr();
  const now=new Date(),y=now.getFullYear(),mo=now.getMonth();
  const first=new Date(y,mo,1).getDay();
  const days=new Date(y,mo+1,0).getDate();
  const cells=id=>{
    const done=new Set((logs[id]||[]).map(l=>l.date));
    let c='';
    ['一','二','三','四','五','六','日'].forEach(h=>c+=`<div class="hd">${h}</div>`);
    for(let i=0;i<first;i++)c+=`<div class="d blank"></div>`;
    for(let d=1;d<=days;d++){
      const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      c+=`<div class="d ${done.has(ds)?'done':''} ${ds===today?'today':''}">${d}</div>`;
    }
    return c;
  };
  const cards=habits.length?habits.map(h=>{
    const hlogs=logs[h.id]||[];
    const sk=streakOf(hlogs,today);
    return `<div class="feat" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="habitchip" style="background:${h.color}">${esc(h.name)}</span>
        ${h.goal?`<span style="font-size:12px;color:var(--ink-faint)">${esc(h.goal)}</span>`:''}
        <span style="font-size:12.5px;color:var(--coral);font-weight:700">🔥 连续 ${sk} 天</span>
        <span style="margin-left:auto;display:flex;gap:8px">
          <button class="addbtn" data-hlog="${h.id}" style="--cc:${h.color};padding:6px 15px">📷 打卡</button>
          <button class="delbtn" data-hdel="${h.id}">删除</button>
        </span>
      </div>
      <div class="minical">${cells(h.id)}</div>
      <div style="margin-top:10px">
        ${hlogs.length?hlogs.slice().reverse().slice(0,5).map((l,ii)=>{
          const idx=hlogs.length-1-ii;
          return `<div class="hlog"><span class="hdt">${esc(l.date)}</span>${l.note?`<span class="htx">${esc(l.note)}</span>`:'<span class="htx" style="color:var(--ink-faint)">打卡</span>'}${l.img?`<img src="${l.img}" data-lb alt="">`:''}<span class="hdel" data-hlogdel="${h.id}__${idx}">×</span></div>`;
        }).join(''):`<div class="empty" style="padding:8px">还没有打卡记录，点「📷 打卡」开始吧</div>`}
      </div>

/* ============ 学习计划：时间点 + 时间段 ============ */
function renderPlan(mid,sid){
  const m=findModule(mid),s=findSub(mid,sid);if(!m||!s)return renderModule(mid);
  state.module=mid;state.sub=sid;state.guest=false;
  const plan=loadStudyPlan();
  const day=state.sched||nowStr();
  const items=(plan[day]||[]).slice().sort((a,b)=>(a.t||'--:--').localeCompare(b.t||'--:--'));
  const doneN=items.filter(i=>i.done).length;
  let total=0;
  items.forEach(i=>{const d=timeToMin(i.e)-timeToMin(i.t);if(!isNaN(d)&&d>0)total+=d;});
  const list=items.length?items.map((it,i)=>`
    <div class="planitem ${it.done?'done':''}">
      <span class="ck" data-ptoggle="${day}__${i}">${it.done?'✓':''}</span>
      <div class="pt">
        <div class="ptt">${esc(it.x)}</div>
        <div class="ptd">${esc(it.t||'--:--')}${it.e?' – '+esc(it.e):''}${fmtDur(it.t,it.e)?' · '+fmtDur(it.t,it.e):''}</div>
      </div>
      <button class="pdel" data-pdel="${day}__${i}">删除</button>
    </div>`).join(''):`<div class="empty">这天还没有学习计划，添加一项吧 ✎</div>`;
  view.innerHTML=`
    <nav class="crumbs"><button data-nav="home">Back to Room</button><span class="sep">/</span><button data-nav="module-study">学习计划</button><span class="sep">/</span><span class="cur">每日学习计划</span></nav>
    <div class="pagehead">
      <div><div class="colnum">STUDY · PLAN</div><h1>🗓 每日学习计划</h1><p>时间点 + 时间段安排学习，勾选完成自动统计专注时长。</p></div>
      <div class="stat">${items.length} 项 · 已完成 ${doneN}<br>专注 ${total?fmtDur('00:00',String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0')):'—'}</div>
    </div>
    <div class="deco">✦ 今日计划 ✦</div>
    <div class="detail">
      <div class="panel" style="--cc:${m.cc}">
        <div class="toolbar">
          <div class="ph" style="margin:0"><span class="ic">🗓</span> <input type="date" id="planDay" value="${day}" style="font-size:15px;font-family:inherit;border:1px solid var(--line2);border-radius:10px;padding:5px 10px;background:#FDF6FA;color:var(--ink)"></div>
          <button class="addbtn" data-addplan="${day}" style="--cc:${m.cc}">＋ 添加安排</button>
        </div>
        <div class="pd">每项都有开始时间（时间点）和结束时间（时间段），完成就打勾 ✓</div>
        <div class="planstat">
          <div class="ps"><b>${items.length}</b><span>计划项</span></div>
          <div class="ps"><b style="color:var(--mint)">${doneN}</b><span>已完成</span></div>
          <div class="ps"><b style="color:var(--coral)">${total?fmtDur('00:00',String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0')):'0'}</b><span>专注时长</span></div>

    </div>`;
}

/* ============ 睡眠记录 ============ */
function sleepDurStr(s,w){
  let a=timeToMin(s),b=timeToMin(w);
  if(isNaN(a)||isNaN(b))return '';
  let d=b-a;if(d<0)d+=24*60;
  if(d<=0)return '';
  return d>=60?Math.floor(d/60)+' 小时'+(d%60?(' '+d%60+' 分'):''):d+' 分钟';
}
function avgSleepHours(list){
  const ds=list.map(r=>{let d=timeToMin(r.vals[2])-timeToMin(r.vals[1]);if(d<0)d+=24*60;return d;}).filter(d=>d>0&&d<=20*60);
  if(!ds.length)return null;
  return Math.round(ds.reduce((a,b)=>a+b,0)/ds.length/6)/10;
}

function waterStep(delta){
  const rows=loadRows('health','water');
  const today=nowStr();
  let tr=rows.find(r=>r.vals[0]===today);
  if(!tr){tr={vals:[today,'0'],ts:Date.now()};rows.push(tr);}
  let c=Math.max(0,+tr.vals[1]||0)+delta;
  if(c<0)c=0;
  tr.vals[1]=String(c);
  saveRows('health','water',rows);
  render();
}

}function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function mondayOf(ds){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d);}
function addDay(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return dkey(d);}

function saveWeekTaskForm(){
  if(!fmMeta||fmMeta.type!=='weektask')return;
  const x=($('[data-f="0"]').value||'').trim();
  if(!x){toast('写点任务内容吧');return;}
  const wk=loadWeekTasks();const mon=mondayOf(state.wmWeek);
  if(!wk[mon])wk[mon]={};
  if(!wk[mon][fmMeta.day])wk[mon][fmMeta.day]=[];
  wk[mon][fmMeta.day].push({x,done:false,ts:Date.now()});
  saveWeekTasks(wk);closeForm();render();
}
function delWeekTask(key){
  const [k,ti]=key.split('__');
  const wk=loadWeekTasks();const mon=mondayOf(state.wmWeek);
  if(wk[mon]&&wk[mon][k]){wk[mon][k].splice(+ti,1);saveWeekTasks(wk);render();}
}
function toggleWeekTask(key){
  const [k,ti]=key.split('__');
  const wk=loadWeekTasks();const mon=mondayOf(state.wmWeek);
  if(wk[mon]&&wk[mon][k]&&wk[mon][k][+ti]){wk[mon][k][+ti].done=!wk[mon][k][+ti].done;saveWeekTasks(wk);render();}
}

const DM_LANES=5,DM_COLORS=['#FFF0F5','#FFF7E8','#EAF7F0','#EFE9FA','#E8F4FA'];
function dateCN(ts){const d=new Date(ts);return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function danmuHTML(msgs){
  return msgs.map((m,i)=>{
    const lane=(i%DM_LANES)*17+6;
    const len=String(m.txt).length+String(m.who||'匿名').length;

function collectIndex(){
  const list=[];
  list.push({key:['首页','home','room','chelsea'].join(' '),label:'首页',ic:'🏠',crumb:'Chelsea\'s room',nav:'home',name:'首页',path:'ROOM'});
  list.push({key:['留言板','guestbook','留言','发送'].join(' '),label:'留言板',ic:'💬',crumb:'首页',nav:'guest',name:'留言板',path:'GUESTBOOK'});
  DATA.forEach(m=>{
    list.push({key:['首页','home',m.name,m.en].join(' '),label:m.name,ic:m.ic,crumb:'房间',nav:`module-${m.id}`,name:m.name,path:m.en});
    m.sub.forEach(s=>{
      list.push({key:[m.name,s.name,s.en,s.desc,(s.feat||[]).join(' ')].join(' '),label:s.name,ic:s.ic,crumb:m.name,nav:`sub-${m.id}-${s.id}`,name:s.name,path:`${m.en} / ${s.name}`});
    });
  });
  return list;
}
const INDEX=collectIndex();
function doSearch(q){
  q=q.trim().toLowerCase();
  if(!q){results.classList.remove('show');return;}
  const hit=INDEX.filter(i=>i.key.toLowerCase().includes(q)).slice(0,10);
  if(!hit.length){results.innerHTML=`<div class="r" style="cursor:default"><div class="nm">未找到匹配项</div></div>`;results.classList.add('show');return;}
  results.innerHTML=hit.map(i=>`<div class="r" data-nav="${i.nav}"><div class="ic">${i.ic}</div><div><div class="nm">${esc(i.label)}</div><div class="path">${esc(i.crumb)} / ${esc(i.path)}</div></div></div>`).join('');
  results.classList.add('show');
}
