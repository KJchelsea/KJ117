document.addEventListener('click',e=>{
  const sday=e.target.closest('[data-sday]');
  if(sday){state.sched=sday.dataset.sday;renderSchedule('utility');return;}
  const sdel=e.target.closest('[data-sdel]');
  if(sdel){
    const [date,t,ed]=sdel.dataset.sdel.split('__');
    const sched=loadSched();
    if(sched[date])sched[date]=sched[date].filter(i=>!(i.t===t&&(i.e||'')===(ed||'')));
    saveSched(sched);render();return;
  }
  const addS=e.target.closest('[data-addsched]');
  if(addS){openSchedForm(addS.dataset.addsched);return;}
  const addP=e.target.closest('[data-addplan]');
  if(addP){openPlanForm(addP.dataset.addplan);return;}
  const ptog=e.target.closest('[data-ptoggle]');
  if(ptog){
    const [day,idx]=ptog.dataset.ptoggle.split('__');
    const plan=loadStudyPlan();
    if(plan[day]&&plan[day][+idx]){plan[day][+idx].done=!plan[day][+idx].done;saveStudyPlan(plan);render();}
    return;
  }
  const pdel=e.target.closest('[data-pdel]');
  if(pdel){
    const [day,idx]=pdel.dataset.pdel.split('__');
    const plan=loadStudyPlan();
    if(plan[day]){plan[day].splice(+idx,1);saveStudyPlan(plan);render();}
    return;
  }
  const addEl=e.target.closest('[data-add]');
  if(addEl){const p=addEl.dataset.add.split('-');openForm(p[0],p[1]);return;}
  // 备忘录
  const addmemo=e.target.closest('[data-addmemo]');
  if(addmemo){openMemoForm();return;}
  const memodel=e.target.closest('[data-memodel]');
  if(memodel){const rows=loadRows('utility','memo');rows.splice(+memodel.dataset.memodel,1);saveRows('utility','memo',rows);render();return;}
  // 菜谱
  const addrec=e.target.closest('[data-addrecipe]');
  if(addrec){openRecipeForm();return;}
  const recdel=e.target.closest('[data-recipedel]');
  if(recdel){if(!confirm('删除这道菜谱？'))return;const rows=loadRows('utility','recipe');rows.splice(+recdel.dataset.recipedel,1);saveRows('utility','recipe',rows);render();return;}
  // 网址收藏
  const bokadd=e.target.closest('[data-bookadd]');
  if(bokadd){openBookmarkForm();return;}
  const bokdel=e.target.closest('[data-bookdel]');
  if(bokdel){if(!confirm('删除这个收藏？'))return;const rows=loadRows('utility','bookmark');rows.splice(+bokdel.dataset.bookdel,1);saveRows('utility','bookmark',rows);render();return;}
  // 喝水
  const wplus=e.target.closest('[data-wplus]');
  if(wplus){waterStep(1);return;}
  const wminus=e.target.closest('[data-wminus]');
  if(wminus){waterStep(-1);return;}
  // 睡眠
  const ssave=e.target.closest('#sleepSave');
  if(ssave){saveSleepForm();return;}
  const slpdel=e.target.closest('[data-sleepdel]');
  if(slpdel){if(!confirm('删除这条睡眠记录？'))return;const rows=loadRows('health','sleep');rows.splice(+slpdel.dataset.sleepdel,1);saveRows('health','sleep',rows);render();return;}
  // 便便
  const bsave=e.target.closest('#bowelSave');
  if(bsave){saveBowelForm();return;}
  const bdel=e.target.closest('[data-boweldel]');
  if(bdel){if(!confirm('删除这条记录？'))return;const rows=loadRows('health','bowel');rows.splice(+bdel.dataset.boweldel,1);saveRows('health','bowel',rows);render();return;}
  // 周月计划
  const wtab2=e.target.closest('[data-wtab]');
  if(wtab2){state.wtab=wtab2.dataset.wtab;renderSub('study','weeks');return;}
  const wtadd=e.target.closest('[data-wtadd]');
  if(wtadd){openWeekTaskForm(wtadd.dataset.wtadd);return;}
  const wtdel=e.target.closest('[data-wtdel]');
  if(wtdel){delWeekTask(wtdel.dataset.wtdel);return;}
  const wtdone=e.target.closest('[data-wtdone]');
  if(wtdone){toggleWeekTask(wtdone.dataset.wtdone);return;}
  const mgadd=e.target.closest('[data-mgadd]');
  if(mgadd){openMonthGoalForm();return;}
  const mgdel=e.target.closest('[data-mgdel]');
  if(mgdel){if(!confirm('删除这个目标？'))return;const m2=loadMonthGoals();if(m2[state.wmMonth]){m2[state.wmMonth].splice(+mgdel.dataset.mgdel,1);saveMonthGoals(m2);render();}return;}
  const mgdone=e.target.closest('[data-mgdone]');
  if(mgdone){const m2=loadMonthGoals();if(m2[state.wmMonth]&&m2[state.wmMonth][+mgdone.dataset.mgdone]){m2[state.wmMonth][+mgdone.dataset.mgdone].done=!m2[state.wmMonth][+mgdone.dataset.mgdone].done;saveMonthGoals(m2);render();}return;}
  const delEl=e.target.closest('[data-del]');
  if(delEl){
    const p=delEl.dataset.del.split('-');const mid=p[0],sid=p[1],idx=+p[2];
    if(!confirm('确定删除这条记录吗？'))return;
    const rows=loadRows(mid,sid);rows.splice(idx,1);saveRows(mid,sid,rows);render();return;
  }
  const navEl=e.target.closest('[data-nav]');
  if(navEl){results.classList.remove('show');search.value='';navigate(navEl.dataset.nav);}
  if(e.target.id==='enterBtn'){enter();}
  if(e.target.id==='enterGuestBtn'){enterGuest();}
  if(e.target.id==='brandLink'){navigate('home');}
  if(e.target.id==='backBtn'){back();}
  if(e.target.id==='roomBtn'){goRoom();}
  if(e.target.id==='gbFire'){fireMessage();}
  // 阅读 tab / 删除
  const rtab=e.target.closest('[data-rtab]');
  if(rtab){state.rtab=rtab.dataset.rtab;render();return;}
  const rbdel=e.target.closest('[data-rbdel]');
  if(rbdel){const books=loadRead('read_books',[]);books.splice(+rbdel.dataset.rbdel,1);saveRead('read_books',books);render();return;}
  const rqdel=e.target.closest('[data-rqdel]');
  if(rqdel){const qs=loadRead('read_quotes',[]);qs.splice(+rqdel.dataset.rqdel,1);saveRead('read_quotes',qs);render();return;}
  const rndel=e.target.closest('[data-rndel]');
  if(rndel){const ns=loadRead('read_notes',[]);ns.splice(+rndel.dataset.rndel,1);saveRead('read_notes',ns);render();return;}
  const rqimg=e.target.closest('[data-rqimgdel]');
  if(rqimg){const [idx,fi]=rqimg.dataset.rqimgdel.split('__');const qs=loadRead('read_quotes',[]);const r=qs[idx];if(r&&r.images){r.images.splice(+fi,1);saveRead('read_quotes',qs);render();}return;}
  const rnimg=e.target.closest('[data-rnimgdel]');
  if(rnimg){const [idx,fi]=rnimg.dataset.rnimgdel.split('__');const ns=loadRead('read_notes',[]);const r=ns[idx];if(r&&r.images){r.images.splice(+fi,1);saveRead('read_notes',ns);render();}return;}
  const addrb=e.target.closest('[data-addreadbook]');
  if(addrb){openReadForm('readbook');return;}
  const addrq=e.target.closest('[data-addreadq]');
  if(addrq){openReadForm('readq');return;}
  const addrn=e.target.closest('[data-addreadn]');
  if(addrn){openReadForm('readn');return;}
  // 习惯
  const htAdd=e.target.closest('#htAdd');
  if(htAdd){
    const name=(($('#ht_name')||{}).value||'').trim();if(!name){alert('请填写习惯名称');return;}
    const habits=loadHabits();
    habits.push({name,goal:(($('#ht_goal')||{}).value||'').trim(),color:HABIT_COLORS[+($('#ht_color')||{}).value]||HABIT_COLORS[0],id:uid(),ts:Date.now()});
    saveHabits(habits);render();return;
  }
  const hlog=e.target.closest('[data-hlog]');
  if(hlog){openHabitLogForm(hlog.dataset.hlog);return;}
  const hdel=e.target.closest('[data-hdel]');
  if(hdel){
    if(!confirm('删除这个习惯及其打卡记录？'))return;
    const habits=loadHabits();const logs=loadHabitLogs();
    const id=hdel.dataset.hdel;
    saveHabits(habits.filter(h=>h.id!==id));
    delete logs[id];saveHabitLogs(logs);render();return;
  }
  const hlogdel=e.target.closest('[data-hlogdel]');
  if(hlogdel){
    const [id,idx]=hlogdel.dataset.hlogdel.split('__');
    const logs=loadHabitLogs();
    if(logs[id]){logs[id].splice(+idx,1);saveHabitLogs(logs);render();}
    return;
  }
  // 爱好
  const hbSave=e.target.closest('#hbSave');
  if(hbSave){
    const name=(($('#hb_name')||{}).value||'').trim();if(!name){alert('请填写爱好名称');return;}
    const date=(($('#hb_date')||{}).value||nowStr());
    const mood=(($('#hb_mood')||{}).value||'').trim();
    const txt=(($('#hb_txt')||{}).value||'').trim();
    if(!txt&&!tempHobbyImg.length){alert('写点文字或添加图片吧');return;}
    const rows=loadRows('growth','hobby');
    rows.push({vals:[name,date+(mood?' · '+mood:''),txt],images:tempHobbyImg.slice(),ts:Date.now()});
    saveRows('growth','hobby',rows);tempHobbyImg=[];render();return;
  }
  const hbdel=e.target.closest('[data-hbdel]');
  if(hbdel){if(!confirm('删除这条爱好记录？'))return;const rows=loadRows('growth','hobby');rows.splice(+hbdel.dataset.hbdel,1);saveRows('growth','hobby',rows);render();return;}
  const hbimg=e.target.closest('[data-hbimgdel]');
  if(hbimg){const [idx,fi]=hbimg.dataset.hbimgdel.split('__');const rows=loadRows('growth','hobby');const r=rows[idx];if(r&&r.images){r.images.splice(+fi,1);saveRows('growth','hobby',rows);render();}return;}
  // 小成就删除
  const adel=e.target.closest('[data-adel]');
  if(adel){if(!confirm('删除这个成就？'))return;const rows=loadRows('growth','achievement');rows.splice(+adel.dataset.adel,1);saveRows('growth','achievement',rows);render();return;}
  // 人类生活指南：删除条目 / 附件
  const gddel=e.target.closest('[data-gddel]');
  if(gddel){if(!confirm('删除这条指南？'))return;const rows=loadRows('growth','guide');rows.splice(+gddel.dataset.gddel,1);saveRows('growth','guide',rows);render();return;}
  const gdfdel=e.target.closest('[data-gdfdel]');
  if(gdfdel){const [idx,fi]=gdfdel.dataset.gdfdel.split('__');const rows=loadRows('growth','guide');const r=rows[idx];if(r&&r.files){r.files.splice(+fi,1);saveRows('growth','guide',rows);render();}return;}
  // 物品档案：自定义种类/位置删除
  const ittypedel=e.target.closest('[data-ittypedel]');
  if(ittypedel){const arr=loadItemTypes();arr.splice(+ittypedel.dataset.ittypedel,1);saveItemTypes(arr);render();return;}
  const itlocdel=e.target.closest('[data-itlocdel]');
  if(itlocdel){const arr=loadItemLocs();arr.splice(+itlocdel.dataset.itlocdel,1);saveItemLocs(arr);render();return;}
  // 倒数日删除
  const ddaydel=e.target.closest('[data-ddaydel]');
  if(ddaydel){if(!confirm('删除这个日子？'))return;const rows=loadRows('utility','days');rows.splice(+ddaydel.dataset.ddaydel,1);saveRows('utility','days',rows);render();return;}
  // 体围删除
  const bd=e.target.closest('[data-bodydel]');
  if(bd){const rows=loadRows('health','body');rows.splice(+bd.dataset.bodydel,1);saveRows('health','body',rows);render();return;}
  // 附件删除（单个/整条）
  const atdel=e.target.closest('[data-atdel]');
  if(atdel){const [idx,fi]=atdel.dataset.atdel.split('__');const rows=loadRows('health','checkup');const r=rows[idx];if(r&&r.files){r.files.splice(+fi,1);saveRows('health','checkup',rows);render();}return;}
  const atrow=e.target.closest('[data-atrow]');
  if(atrow){if(!confirm('删除这条报告？'))return;const rows=loadRows('health','checkup');rows.splice(+atrow.dataset.atrow,1);saveRows('health','checkup',rows);render();return;}
  // 日记图片删除 / 整条
  const djdel=e.target.closest('[data-djdel]');
  if(djdel){const [idx,fi]=djdel.dataset.djdel.split('__');const rows=loadRows('timeline','diary');const r=rows[idx];if(r&&r.images){r.images.splice(+fi,1);saveRows('timeline','diary',rows);render();}return;}
  const djrow=e.target.closest('[data-djrow]');
  if(djrow){if(!confirm('删除这则日记？'))return;const rows=loadRows('timeline','diary');rows.splice(+djrow.dataset.djrow,1);saveRows('timeline','diary',rows);render();return;}
  // 课表
  const ttAdd=e.target.closest('#ttAdd');
  if(ttAdd){openTTForm();return;}
  const ttcell=e.target.closest('[data-ttcell]');
  if(ttcell){const [day,period]=ttcell.dataset.ttcell.split('__');openTTForm(day,period);return;}
  // 课表修改：点击课程项时弹出编辑表单
  const ttdel2=e.target.closest('[data-ttdel]');
  if(ttdel2){
    const [day,period,i]=ttdel2.dataset.ttdel.split('__');
    const tt=loadTT();
    const dayItems=tt.filter(c=>c.day===day&&c.period===period);
    const item=dayItems[+i];
    if(item){
      fmMeta={type:'tt_edit',day,item};
      $('#fmTitle').textContent='✏ 编辑课程';
      $('#fmDesc').textContent='修改课程信息';
      const dayIdx=TT_DAYS.indexOf(item.day);
      const periodIdx=TT_PERIODS.indexOf(item.period);
      $('#fmFields').innerHTML=`
        <label>星期</label><select data-f="0">${TT_DAYS.map((d,idx)=>`<option ${idx===dayIdx?'selected':''}>${d}</option>`).join('')}</select>
        <label>时段</label><select data-f="1">${TT_PERIODS.map((p,idx)=>`<option ${idx===periodIdx?'selected':''}>${p}</option>`).join('')}</select>
        <label>课程名</label><input data-f="2" type="text" value="${esc(item.name)}">
        <label>时间</label><input data-f="3" type="text" value="${esc(item.time||'')}">
        <label>地点/教师</label><input data-f="4" type="text" value="${esc(item.loc||'')}">
        <label>备注</label><input data-f="6" type="text" value="${esc(item.note||'')}">
        <label>颜色</label><select data-f="5">${TT_COLORS.map((c,idx)=>`<option value="${idx}" ${c===item.color?'selected':''}>${['蔷薇粉','珊瑚','薄荷','杏黄','雾紫','雾蓝'][idx]}</option>`).join('')}</select>`;
      fm.classList.add('show');
    }
    return;
  }
  const ttdel=e.target.closest('[data-ttdel]');
  if(ttdel){const [day,period,i]=ttdel.dataset.ttdel.split('__');const tt=loadTT();const idx=tt.findIndex(c=>c.day===day&&c.period===period&&tt.filter(x=>x.day===day&&x.period===period)[+i]===c);if(idx>-1){tt.splice(idx,1);saveTT(tt);render();}return;}
  // 心情打卡 / 删除
  const moodday=e.target.closest('[data-moodday]');
  if(moodday){openMoodForm(moodday.dataset.moodday);return;}
  const mooddel=e.target.closest('[data-mooddel]');
  if(mooddel){const moods=loadMood();moods.splice(+mooddel.dataset.mooddel,1);saveMood(moods);render();return;}
  // 大图预览
  const lb=e.target.closest('[data-lb]');
  if(lb){showLB(e.target.src||e.target.currentSrc);return;}
  if(e.target.id==='lbClose'){hideLB();}
});
$('#fmCancel').addEventListener('click',closeForm);
$('#fmSave').addEventListener('click',()=>{
  if(fmMeta&&fmMeta.type==='sched')saveSchedForm();
  else if(fmMeta&&fmMeta.type==='tt')saveTTForm();
  else if(fmMeta&&fmMeta.type==='tt_edit')saveTTForm();
  else if(fmMeta&&fmMeta.type==='mood')saveMoodForm();
  else if(fmMeta&&fmMeta.type==='plan')savePlanForm();
  else if(fmMeta&&fmMeta.type==='hablog')saveHabitLogForm();
  else if(fmMeta&&fmMeta.type==='readq')saveReadForm('readq');
  else if(fmMeta&&fmMeta.type==='readn')saveReadForm('readn');
  else if(fmMeta&&fmMeta.type==='readbook')saveReadForm('readbook');
  else if(fmMeta&&fmMeta.type==='memo')saveMemoForm();
  else if(fmMeta&&fmMeta.type==='recipe')saveRecipeForm();
  else if(fmMeta&&fmMeta.type==='bookmark')saveBookmarkForm();
  else if(fmMeta&&fmMeta.type==='weektask')saveWeekTaskForm();
  else if(fmMeta&&fmMeta.type==='monthgoal')saveMonthGoalForm();
  else if(fmMeta&&fmMeta.type==='flow')saveFlowForm();
  else if(fmMeta&&fmMeta.type==='skcheck')saveSkillCheckForm();
  else if(fmMeta&&fmMeta.type==='memofolder')saveMemoFolderForm();
  else saveForm();
});
fm.addEventListener('click',e=>{if(e.target===fm)closeForm();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm();});
/* 计划日期切换 */
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='planDay'){
    state.sched=e.target.value||nowStr();
    render();
  }
  if(e.target&&e.target.id==='wmWeek'){
    state.wmWeek=e.target.value||state.wmWeek;
    render();
  }
  if(e.target&&e.target.id==='wmMonth'){
    state.wmMonth=e.target.value||state.wmMonth;
    render();
  }
});
/* 临时附件/图片暂存 */
let tempAttaches=[],tempImages=[],tempSkImages=[];
/* 文件 input change 委托 */
document.addEventListener('change',e=>{
  const t=e.target;
  if(t&&t.id==='at_file'){
    const files=Array.from(t.files||[]);
    const grid=document.getElementById('at_preview');tempAttaches=[];
    files.forEach((f,i)=>{
      if(f.size>2*1024*1024)return;
      readFileAsDataURL(f).then(durl=>{
        tempAttaches.push({name:f.name,type:f.type,data:durl});
        const div=document.createElement('div');
        if(f.type.startsWith('image/'))div.innerHTML=`<div class="attachimg"><img src="${durl}" alt=""><span class="del" data-tmpat="${i}">×</span></div>`;
        else div.innerHTML=`<div class="attachdoc">📄 ${esc(f.name)}<span class="del" data-tmpat="${i}">×</span></div>`;
        grid.appendChild(div);
      });
    });
    t.value='';return;
  }
  if(t&&t.id==='dj_file'){
    const files=Array.from(t.files||[]);
    const grid=document.getElementById('dj_preview');
    files.forEach((f,i)=>{
      if(f.size>2*1024*1024)return;
      readFileAsDataURL(f).then(durl=>{
        tempImages.push(durl);
        const div=document.createElement('div');
        div.innerHTML=`<div class="attachimg"><img src="${durl}" data-lb alt=""><span class="del" data-tmpdj="${tempImages.length-1}">×</span></div>`;
        grid.appendChild(div);
      });
    });
    t.value='';return;
  }
  if(t&&t.id==='rd_file'){
    const f=t.files&&t.files[0];if(!f||f.size>2*1024*1024){t.value='';return;}
    readFileAsDataURL(f).then(durl=>{
      tempReadImg.push(durl);
      const grid=document.getElementById('rd_preview');
      if(!grid)return;
      const div=document.createElement('div');
      div.innerHTML=`<div class="attachimg"><img src="${durl}" data-lb alt=""><span class="del" data-tmprd="${tempReadImg.length-1}">×</span></div>`;
      grid.appendChild(div);
    });
    t.value='';return;
  }
  if(t&&t.id==='hlog_file'){
    const f=t.files&&t.files[0];if(!f||f.size>2*1024*1024){t.value='';return;}
    readFileAsDataURL(f).then(durl=>{
      tempHabitImg=durl;
      const grid=document.getElementById('hlog_preview');
      if(!grid)return;
      grid.innerHTML=`<div class="attachimg"><img src="${durl}" data-lb alt=""><span class="del" data-tmphlog>×</span></div>`;
    });
    t.value='';return;
  }
  if(t&&t.id==='hb_file'){
    const files=Array.from(t.files||[]);
    const grid=document.getElementById('hb_preview');
    files.forEach((f,i)=>{
      if(f.size>2*1024*1024)return;
      readFileAsDataURL(f).then(durl=>{
        tempHobbyImg.push(durl);
        const div=document.createElement('div');
        div.innerHTML=`<div class="attachimg"><img src="${durl}" data-lb alt=""><span class="del" data-tmphb="${tempHobbyImg.length-1}">×</span></div>`;
        grid.appendChild(div);
      });
    });
    t.value='';return;
  }
  /* 心情手帐：图片/文件 */
  if(t&&t.id==='md_file'){
    const files=Array.from(t.files||[]);
    const grid=document.getElementById('md_preview');
    files.forEach((f,i)=>{
      if(f.size>2*1024*1024){toast('单文件不能超过2MB');return;}
      readFileAsDataURL(f).then(durl=>{
        tempMoodFiles.push({name:f.name,type:f.type,data:durl});
        const idx=tempMoodFiles.length-1;
        const div=document.createElement('div');
        if(f.type.startsWith('image/'))div.innerHTML=`<div class="attachimg"><img src="${durl}" data-lb alt=""><span class="del" data-tmpmd="${idx}">×</span></div>`;
        else div.innerHTML=`<div class="attachdoc">📄 ${esc(f.name)}<span class="del" data-tmpmd="${idx}">×</span></div>`;
        grid.appendChild(div);
      });
    });
    t.value='';return;
  }
  /* 个人SOP：图片/文件 */
  if(t&&t.id==='sp_file'){
    const files=Array.from(t.files||[]);
    const grid=document.getElementById('sp_preview');
    files.forEach((f,i)=>{
      if(f.size>2*1024*1024){toast('单文件不能超过2MB');return;}
      readFileAsDataURL(f).then(durl=>{
        tempSopFiles.push({name:f.name,type:f.type,data:durl});
        const idx=tempSopFiles.length-1;
        const div=document.createElement('div');
        if(f.type.startsWith('image/'))div.innerHTML=`<div class="attachimg"><img src="${durl}" data-lb alt=""><span class="del" data-tmpsp="${idx}">×</span></div>`;
        else div.innerHTML=`<div class="attachdoc">📄 ${esc(f.name)}<span class="del" data-tmpsp="${idx}">×</span></div>`;
        grid.appendChild(div);
      });
    });
    t.value='';return;
  }
  /* 感恩日记：图片/文件 */
  if(t&&t.id==='gt_file'){
    const files=Array.from(t.files||[]);
    const grid=document.getElementById('gt_preview');
    files.forEach((f,i)=>{

document.addEventListener('click',e=>{
  const pomot=e.target.closest('[data-pomotoggle]');
  if(pomot){
    const id=+pomot.dataset.pomotoggle;
    const tasks=loadPomoTasks();
    const t=tasks.find(x=>x.id===id);
    if(t){t.done=!t.done;t.status=t.done?'已完成':'进行中';savePomoTasks(tasks);renderPomoTasks();updatePomoCurrentLabel();}
    return;
  }
  const pomotd=e.target.closest('[data-pomotdel]');
  if(pomotd){
    if(!confirm('删除这个任务？'))return;
    const tasks=loadPomoTasks();
    const id=+pomotd.dataset.pomotdel;
    const idx=tasks.findIndex(x=>x.id===id);
    if(idx>-1){tasks.splice(idx,1);savePomoTasks(tasks);renderPomoTasks();}
    if(pomoCurrentId===id){pomoCurrentId=null;updatePomoCurrentLabel();}
    return;
  }
  // 点击待办行（避开打勾/删除/文字编辑区）→ 设为当前任务
  const pomorow=e.target.closest('[data-pomotask]');
  if(pomorow){
    if(e.target.closest('.ck')||e.target.closest('.pdel')||e.target.closest('.ptt'))return;
    pomoCurrentId=+pomorow.dataset.pomotask;
    renderPomoTasks();
    updatePomoCurrentLabel();
    return;
  }
});

function navigate(nav){
  if(nav==='home'){state.module=null;state.sub=null;state.guest=false;state.sched=null;state.rtab='books';}
  else if(nav==='guest'){state.guest=true;state.module=null;state.sub=null;state.sched=null;}
  else if(nav.startsWith('module-')){state.module=nav.slice(7);state.sub=null;state.guest=false;state.sched=null;}
  else if(nav.startsWith('sub-')){const p=nav.slice(4).split('-');state.module=p[0];state.sub=p[1];state.guest=false;state.sched=null;}
  render();scrollTo(0,0);
}
function back(){
  if(state.guest){state.guest=false;render();}
  else if(state.sched){state.sched=null;state.sub='schedule';render();}
  else if(state.sub){state.sub=null;render();}
  else if(state.module){state.module=null;render();}
  scrollTo(0,0);
}

/* ===== 密码锁：除留言板外均需密码 ===== */
const PASS_KEY=PREFIX+'pass';
let unlocked=false,lockMode='lock';
function hasPass(){try{return !!localStorage.getItem(PASS_KEY);}catch(e){return false;}}
function showLock(mode){
  lockMode=mode||(hasPass()?'lock':'setup');
  const ls=document.getElementById('lockScreen');
  const p1=document.getElementById('lockPass'),p2=document.getElementById('lockPass2');
  const ok=document.getElementById('lockOk'),h=document.getElementById('lockHint');
  const chg=document.getElementById('lockChange'),rst=document.getElementById('lockReset');
  if(lockMode==='setup'){
    h.textContent='首次使用，先设置一个进入密码（至少 4 位）';
    p2.style.display='block';ok.textContent='设置密码';
    if(chg)chg.style.display='none';if(rst)rst.style.display='none';
  }else{
    h.textContent='输入密码，进入你的房间';
    p2.style.display='none';ok.textContent='解锁';
    if(chg)chg.style.display='block';if(rst)rst.style.display='none';
  }
  p1.value='';p2.value='';ls.classList.add('show');
}
function hideLock(){const ls=document.getElementById('lockScreen');if(ls)ls.classList.remove('show');}
function enter(){
  splash.style.opacity='0';
  setTimeout(()=>{
    splash.style.display='none';topbar.style.display='flex';app.classList.add('show');
    if(unlocked){hideLock();render();}
    else showLock();
  },550);
}
function enterGuest(){
  splash.style.opacity='0';
  setTimeout(()=>{
    splash.style.display='none';topbar.style.display='flex';app.classList.add('show');
    hideLock();navigate('guest');
  },400);
}
(function(){
  document.getElementById('lockOk')?.addEventListener('click',()=>{
    const p1=document.getElementById('lockPass').value;
    if(lockMode==='setup'){
      const p2=document.getElementById('lockPass2').value;
      if(p1.length<4){toast('密码至少 4 位');return;}
      if(p1!==p2){toast('两次输入不一致');return;}
      try{localStorage.setItem(PASS_KEY,p1);}catch(e){}
      unlocked=true;hideLock();toast('密码设置成功');render();
    }else{
      try{if(p1===localStorage.getItem(PASS_KEY)){unlocked=true;hideLock();render();}else toast('密码不对哦，再试一次');}catch(e){toast('读取密码失败');}
    }
  });
  document.getElementById('lockGuest')?.addEventListener('click',()=>{unlocked=false;hideLock();navigate('guest');});
  document.getElementById('lockChange')?.addEventListener('click',()=>{
    const old=prompt('请输入当前密码：');
    if(old===null)return;
    if(old!==localStorage.getItem(PASS_KEY)){toast('当前密码不对');return;}
    const n1=prompt('请输入新密码（至少 4 位）：');
    if(!n1||n1.length<4){toast('密码至少 4 位');return;}
    const n2=prompt('请再次输入新密码：');
    if(n1!==n2){toast('两次输入不一致');return;}
    localStorage.setItem(PASS_KEY,n1);toast('密码已更新');
  });
  document.getElementById('lockBtn')?.addEventListener('click',()=>{showLock('lock');});
})();

let selIdx=-1;
search.addEventListener('keydown',e=>{
  const items=results.querySelectorAll('.r');
  if(!items.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();selIdx=Math.min(selIdx+1,items.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();selIdx=Math.max(selIdx-1,0);}
  else if(e.key==='Enter'&&selIdx>=0){items[selIdx].click();selIdx=-1;return;}
  else if(e.key==='Enter'){const f=results.querySelector('.r');if(f)f.click();return;}
  else return;
  items.forEach((it,i)=>it.classList.toggle('active',i===selIdx));
});

/* --- 睡眠记录增强：月视图 --- */
function renderSleepMonth(mid, sid) {
  const m = findModule(mid), s = findSub(mid, sid);
  if (!m || !s) return renderModule(mid);
  state.module = mid; state.sub = sid; state.guest = false; state.sched = null;
  const rows = loadRows(mid, sid);
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  const first = new Date(y, mo, 1).getDay();
  const days = new Date(y, mo + 1, 0).getDate();
  const byDate = {};
  rows.forEach(r => byDate[r.vals[0]] = r);
  
  // Build month grid
  let cells = '';
  ['一','二','三','四','五','六','日'].forEach(d => cells += `<div class="mh">${d}</div>`);
  for (let i = 0; i < first; i++) cells += `<div class="md blank"></div>`;
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = byDate[ds];
    const isToday = ds === nowStr();
    let dotColor = '#B7D8C8';
    let dotText = '';
    if (rec) {
      const dur = sleepDurStr(rec.vals[1], rec.vals[2]);
      dotText = dur || '';
      const q = rec.vals[3] || '';
      if (/很差|有点差/.test(q)) dotColor = '#F09A9A';
      else if (/很好/.test(q)) dotColor = '#B7D8C8';
      else dotColor = '#F6DFA8';
    }
    cells += `<div class="md ${isToday?'today':''}" data-sleepday="${ds}">
      <div class="dn">${d}</div>
      <div class="dv" style="color:${dotColor}">${dotText}</div>
    </div>`;
  }
  
  // Year view
  let yearCells = '';
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  monthNames.forEach((mn, idx) => {
    const prefix = `${y}-${String(idx+1).padStart(2,'0')}`;
    const cnt = rows.filter(r => r.vals[0] && r.vals[0].startsWith(prefix)).length;
    yearCells += `<div class="ym"><b>${mn}</b><div class="bar"><i style="width:${Math.min(cnt*8,100)}%"></i></div><div style="font-size:11px;color:var(--ink-faint);margin-top:4px">${cnt} 天</div></div>`;
  });

  view.innerHTML = `
    <nav class="crumbs"><button data-nav="home">Back to Room</button><span class="sep">/</span><button data-nav="module-health">健康管理</button><span class="sep">/</span><span class="cur">睡眠记录</span></nav>
    <div class="pagehead">

/* --- 喝水记录增强：月视图 --- */
function renderWaterMonth(mid, sid) {
  const m = findModule(mid), s = findSub(mid, sid);
  if (!m || !s) return renderModule(mid);
  state.module = mid; state.sub = sid; state.guest = false; state.sched = null;
  const rows = loadRows(mid, sid);
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  const first = new Date(y, mo, 1).getDay();
  const days = new Date(y, mo + 1, 0).getDate();
  const byDate = {};
  rows.forEach(r => byDate[r.vals[0]] = r);
  const today = nowStr();
  const goal = 8;
  
  let cells = '';
  ['一','二','三','四','五','六','日'].forEach(d => cells += `<div class="mh">${d}</div>`);
  for (let i = 0; i < first; i++) cells += `<div class="md blank"></div>`;
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = byDate[ds];
    const cups = rec ? Math.max(0, +rec.vals[1] || 0) : 0;
    const isToday = ds === today;
    const done = cups >= goal;
    cells += `<div class="md ${isToday?'today':''} ${done?'done':''}" data-waterday="${ds}" style="border-color:${done?'var(--mint)':'var(--line)'};background:${done?'#E8F8F0':'#fff'}">
      <div class="dn">${d}</div>
      <div class="dv">${cups}/${goal}杯</div>
    </div>`;
  }
  
  // Year view
  let yearCells = '';
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  monthNames.forEach((mn, idx) => {
    const prefix = `${y}-${String(idx+1).padStart(2,'0')}`;
    const cnt = rows.filter(r => r.vals[0] && r.vals[0].startsWith(prefix)).length;
    yearCells += `<div class="ym"><b>${mn}</b><div class="bar"><i style="width:${Math.min(cnt*8,100)}%"></i></div><div style="font-size:11px;color:var(--ink-faint);margin-top:4px">${cnt} 天</div></div>`;
  });

  view.innerHTML = `
    <nav class="crumbs"><button data-nav="home">Back to Room</button><span class="sep">/</span><button data-nav="module-health">健康管理</button><span class="sep">/</span><span class="cur">喝水打卡</span></nav>
    <div class="pagehead">
      <div><div class="colnum">HEALTH · WATER</div><h1>💧 喝水打卡</h1><p>每天几杯水，月视图清晰追踪补水习惯。</p></div>
      <div class="stat">今日 ${(() => { const tr=rows.find(r=>r.vals[0]===today); return tr?Math.max(0,+tr.vals[1]||0):0; })()} / ${goal} 杯</div>
    </div>
    <div class="deco">✦ 多喝水，皮肤好好 ✦</div>
    <div class="detail">
      <div class="panel" style="--cc:${m.cc}">
        <div class="ph"><span class="ic">🥤</span> 今日喝水</div>
        <div class="pd">每喝一杯就点一下「＋ 记录一杯」。</div>
        <div class="waterbig"><span class="wcount">${(() => { const tr=rows.find(r=>r.vals[0]===today); return tr?Math.max(0,+tr.vals[1]||0):0; })()}</span><span class="wunit">杯 / 目标 ${goal} 杯</span></div>
        <div class="progbar"><i style="width:${Math.min(100,(() => { const tr=rows.find(r=>r.vals[0]===today); return tr?Math.max(0,+tr.vals[1]||0):0; })()/goal*100)}%"></i></div>
        <div class="pd" style="text-align:center">${(() => { const tr=rows.find(r=>r.vals[0]===today); const c=tr?Math.max(0,+tr.vals[1]||0):0; return c>=goal?'达标啦，今天喝够水了 🎉':'还差 '+(goal-c)+' 杯，继续加油'; })()}</div>
        <div class="formrow" style="justify-content:center;margin-top:6px">
          <button class="addbtn" data-wplus style="--cc:${m.cc}">＋ 记录一杯</button>
          <button class="delbtn" data-wminus>－ 撤销一杯</button>
        </div>
      </div>
      <div class="panel" style="--cc:${m.cc}">
        <div class="ph"><span class="ic">📅</span> ${y}年${mo+1}月 喝水月视图</div>
        <div class="pd">绿色 = 达标，数字表示喝水量。</div>
        <div class="monthview">${cells}</div>
      </div>
      <div class="panel" style="--cc:${m.cc}">
        <div class="ph"><span class="ic">📊</span> 全年喝水概览</div>
        <div class="pd">各月喝水打卡天数。</div>
        <div class="yearview">${yearCells}</div>
      </div>
      <div class="panel" style="--cc:${m.cc}">
        <div class="ph"><span class="ic">📊</span> 最近记录</div>
        <div class="pd">近 10 天的喝水情况。</div>
        ${rows.slice().sort((a,b)=>a.vals[0]<b.vals[0]?1:-1).slice(0,10).length 
          ? rows.slice().sort((a,b)=>a.vals[0]<b.vals[0]?1:-1).slice(0,10).map(r => {
              const cc = Math.max(0, +r.vals[1] || 0);

            }).join('') 
          : '<div class="empty">今天先来一杯吧 💧</div>'}

    </div>`;
}

/* --- 技能 / 语言：每日打卡照片 + 月历打卡图 + 本月照片墙 --- */
function loadSkillItems(type){try{const r=localStorage.getItem(PREFIX+'growth_'+type+'_items');if(r!==null)return JSON.parse(r);}catch(e){}return [];}
function saveSkillItems(type,list){try{localStorage.setItem(PREFIX+'growth_'+type+'_items',JSON.stringify(list));}catch(e){}}
function skillStreak(checkins,today){
  let streak=0;const d=new Date(today);
  for(let i=0;i<400;i++){
    const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(checkins[k]){streak++;d.setDate(d.getDate()-1);}else break;
  }
  return streak;
}
function renderSkillLang(mid, sid) {

  function miniCal(chk, idx){

/* --- 每日学习计划增强：月汇总/年汇总 --- */
function renderPlanSummary(mid, sid) {
  const m = findModule(mid), s = findSub(mid, sid);
  if (!m || !s) return renderModule(mid);
  state.module = mid; state.sub = sid; state.guest = false;
  const plan = loadStudyPlan();
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  
  // Calculate monthly stats
  let monthStats = [];
  for (let month = 0; month <= mo; month++) {
    const prefix = `${y}-${String(month+1).padStart(2,'0')}`;
    let total = 0, done = 0;
    Object.keys(plan).forEach(day => {
      if (day.startsWith(prefix)) {
        plan[day].forEach(item => {
          total++;
          if (item.done) done++;
        });
      }
    });
    monthStats.push({ month: month+1, total, done, pct: total ? Math.round(done/total*100) : 0 });
  }
  
  // Year total
  let yearTotal = 0, yearDone = 0;
  Object.keys(plan).forEach(day => {
    if (day.startsWith(String(y))) {
      plan[day].forEach(item => {
        yearTotal++;
        if (item.done) yearDone++;
      });
    }
  });
  
  // Monthly view
  let monthGrid = '';
  monthStats.forEach(ms => {
    monthGrid += `<div class="ym"><b>${ms.month}月</b><div class="bar"><i style="width:${ms.pct}%"></i></div><div style="font-size:11px;color:var(--ink-faint);margin-top:4px">${ms.done}/${ms.total} 完成 ${ms.pct}%</div></div>`;
  });
  
  // Year view
  let yearGrid = '';
  for (let year = y; year >= y-2; year--) {
    let yt = 0, yd = 0;
    Object.keys(plan).forEach(day => {
      if (day.startsWith(String(year))) {
        plan[day].forEach(item => {
          yt++;
          if (item.done) yd++;
        });
      }
    });
    yearGrid += `<div class="ym"><b>${year}年</b><div class="bar"><i style="width:${yt?Math.round(yd/yt*100):0}%"></i></div><div style="font-size:11px;color:var(--ink-faint);margin-top:4px">${yd}/${yt} 完成</div></div>`;
  }

  view.innerHTML = `
    <nav class="crumbs"><button data-nav="home">Back to Room</button><span class="sep">/</span><button data-nav="module-study">学习计划</button><span class="sep">/</span><span class="cur">每日学习计划</span></nav>
    <div class="pagehead">
      <div><div class="colnum">STUDY · PLAN</div><h1>🗓 每日学习计划</h1><p>时间点+时间段安排学习，月汇总年汇总见证你的成长。</p></div>
      <div class="stat">今年共 ${yearTotal} 项 · 完成 ${yearDone} 项</div>
    </div>
    <div class="deco">✦ 学习成长轨迹 ✦</div>
    <div class="detail">
      <div class="panel" style="--cc:${m.cc}">
        <div class="toolbar">
          <div class="ph" style="margin:0"><span class="ic">🗓</span> <input type="date" id="planDay" value="${nowStr()}" style="font-size:15px;font-family:inherit;border:1px solid var(--line2);border-radius:10px;padding:5px 10px;background:#FDF6FA;color:var(--ink)"></div>
          <button class="addbtn" data-addplan="${nowStr()}" style="--cc:${m.cc}">＋ 添加安排</button>
        </div>
        <div class="pd">每项都有开始时间和结束时间，完成就打勾 ✓</div>
        <div class="planstat">
          <div class="ps"><b>${(plan[nowStr()]||[]).length}</b><span>今日计划</span></div>
          <div class="ps"><b style="color:var(--mint)">${(plan[nowStr()]||[]).filter(i=>i.done).length}</b><span>已完成</span></div>
        </div>
        <div class="planitem-list">${(plan[nowStr()]||[]).length ? (plan[nowStr()]||[]).map((it,i) => `
          <div class="planitem ${it.done?'done':''}">
            <span class="ck" data-ptoggle="${nowStr()}__${i}">${it.done?'✓':''}</span>
            <div class="pt"><div class="ptt">${esc(it.x)}</div><div class="ptd">${esc(it.t||'--:--')}${it.e?' – '+esc(it.e):''}</div></div>
            <button class="pdel" data-pdel="${nowStr()}__${i}">删除</button>
          </div>`).join('') : '<div class="empty">今天还没有学习计划，添加一项吧 ✎</div>'}
        </div>
      </div>
      <div class="panel" style="--cc:${m.cc}">
        <div class="ph"><span class="ic">📊</span> 月度学习汇总</div>
        <div class="pd">${y}年各月学习计划完成情况。</div>
        <div class="kpis">
          <div class="kpi"><div class="v">${yearTotal}</div><div class="l">全年计划</div></div>
          <div class="kpi"><div class="v">${yearDone}</div><div class="l">已完成</div></div>

function renderDays(mid, sid) {
  const m = findModule(mid), s = findSub(mid, sid);
  if (!m || !s) return renderModule(mid);
  state.module = mid; state.sub = sid; state.guest = false; state.sched = null;
  const rows = loadRows('utility', 'days');
  const t0 = new Date(nowStr() + 'T00:00:00').getTime();
  const cards = rows.length ? rows.map((r, i) => {
    const name = r.vals[0] || '';
    const date = r.vals[1] || '';
    const type = r.vals[2] || '倒数';
    const note = r.vals[3] || '';
    let big = '—', sub = '', past = false;
    if (date) {
      const target = new Date(date + 'T00:00:00').getTime();
      const diff = Math.round((target - t0) / 86400000);
      if (type === '正数' || type === '纪念日') {
        if (diff >= 0) { big = diff; sub = '还有 ' + diff + ' 天'; }
        else { past = true; big = Math.abs(diff); sub = '已过去 ' + Math.abs(diff) + ' 天'; }
      } else {
        if (diff >= 0) { big = diff; sub = '还有 ' + diff + ' 天'; }

/* 番茄钟事件绑定函数 - 在渲染后调用 */
function bindPomodoroEvents() {
  var startBtn = document.getElementById('pomoStart');
  var stopBtn = document.getElementById('pomoStop');
  var resetBtn = document.getElementById('pomoReset');
  if (startBtn) startBtn.addEventListener('click', startPomodoro);
  if (stopBtn) stopBtn.addEventListener('click', stopPomodoro);
  if (resetBtn) resetBtn.addEventListener('click', resetPomodoro);
  var addTaskBtn = document.getElementById('pomoAddTask');
  if (addTaskBtn) {
    addTaskBtn.addEventListener('click', function() {
      var taskName = prompt('请输入任务名称：');
      if (!taskName) return;
      var taskDur = prompt('请输入预计时长（分钟）：', '25');
      var tasks = loadPomoTasks();
      var newId = tasks.length ? Math.max.apply(null, tasks.map(function(t){return t.id;})) + 1 : 1;
      tasks.push({id: newId, name: taskName, duration: taskDur || '25', done: false, status: '进行中', ts: Date.now()});
      savePomoTasks(tasks);
      renderPomoTasks();
    });
  }
  document.querySelectorAll('[data-pomotasktxt]').forEach(function(el) {
    el.addEventListener('blur', function() {
      var id = this.dataset.pomotasktxt;
      var tasks = loadPomoTasks();
      var t = tasks.find(function(x){return x.id == id;});
      if (t) { t.name = this.textContent.trim(); savePomoTasks(tasks); if (t.id === pomoCurrentId) updatePomoCurrentLabel(); }
    });
  });
  document.querySelectorAll('[data-pomotaskdur]').forEach(function(el) {
    el.addEventListener('dblclick', function() {
      var newDur = prompt('修改时长（分钟）：', this.textContent);
      if (newDur !== null) {
        var id = this.dataset.pomotaskdur;
        var tasks = loadPomoTasks();
        var t = tasks.find(function(x){return x.id == id;});
        if (t) { t.duration = newDur; savePomoTasks(tasks); this.textContent = newDur + '分钟'; }
      }
    });
  });
  document.querySelectorAll('[data-pomotaskstatus]').forEach(function(el) {
    el.addEventListener('dblclick', function() {
      var newStatus = this.textContent === '进行中' ? '已完成' : '进行中';
      var id = this.dataset.pomotaskstatus;
      var tasks = loadPomoTasks();
      var t = tasks.find(function(x){return x.id == id;});
      if (t) { t.status = newStatus; savePomoTasks(tasks); this.textContent = newStatus; }
    });
  });
  if (typeof renderPomoTasks === 'function') renderPomoTasks();
  var minutesEl = document.getElementById('pomoMinutes');
  if (minutesEl) {
    minutesEl.addEventListener('change', function() {
      if (!pomoRunning) {
        pomoSeconds = (parseInt(minutesEl.value) || 25) * 60;
        updatePomoDisplay();
      }
    });
  }
  updatePomoCurrentLabel();
}

/* --- 收支流水：共享分类/日期解析 --- */
const FLOW_INC=['工资','奖金','理财','兼职','红包','礼金','收入','稿费','报销','投资收益'];
const FLOW_EXP=['餐饮','交通','购物','娱乐','居住','日用','医疗','教育','支出','水电','通讯','服饰'];
function flowClassify(r){
  const v0=String(r.vals[0]||''),v1=String(r.vals[1]||''),v3=String(r.vals[3]||'');
  if(/结余|余额|汇总/.test(v0))return {type:'balance',amount:0,cat:v0};
  let type=null;
  if(/收入|工资|奖金|理财|兼职|红包|礼金|稿费|报销|投资收益/.test(v1))type='income';
  else if(/支出|餐饮|交通|购物|娱乐|居住|日用|医疗|教育|水电|通讯|服饰/.test(v1))type='expense';
  if(!type)type=FLOW_INC.some(c=>v0.includes(c))?'income':(FLOW_EXP.some(c=>v0.includes(c))?'expense':null);
  if(!type)type=v3==='income'?'income':(v3==='expense'?'expense':null);
  let num=parseFloat(String(v1).replace(/[^\d.\-]/g,''))||parseFloat(String(v0).replace(/[^\d.\-]/g,''))||0;
  if(num<0){type=type||'expense';num=Math.abs(num);}
  if(!type)type='income';
  return {type,amount:Math.abs(num),cat:v0};
}
function flowRowDate(r){
  let d=String(r.vals[2]||'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;
  if(d==='今天')return nowStr();
  if(d==='昨天'){const dt=new Date();dt.setDate(dt.getDate()-1);return dkey(dt);}
  const m1=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m1)return m1[1]+'-'+String(+m1[2]).padStart(2,'0')+'-'+String(+m1[3]).padStart(2,'0');
  const m2=d.match(/^(\d{1,2})月(\d{1,2})日/);
  if(m2)return new Date().getFullYear()+'-'+String(+m2[1]).padStart(2,'0')+'-'+String(+m2[2]).padStart(2,'0');
  return nowStr();
}
function buildFlowDayMap(rows){
  const dayMap={};
  rows.forEach(r=>{
    const dt=flowRowDate(r),c=flowClassify(r);
    if(c.type==='balance')return;
    if(!dayMap[dt])dayMap[dt]={inc:0,exp:0,items:[]};
    if(c.type==='income')dayMap[dt].inc+=c.amount;else dayMap[dt].exp+=c.amount;
    dayMap[dt].items.push({cat:c.cat,amount:c.amount,type:c.type,date:dt});
  });
  return dayMap;
}
function flowMonthStat(dayMap,prefix){
  let inc=0,exp=0,cnt=0;
  Object.keys(dayMap).forEach(d=>{if(d.startsWith(prefix)){inc+=dayMap[d].inc;exp+=dayMap[d].exp;cnt+=dayMap[d].items.length;}});
  return {inc,exp,cnt};
}

function loadItemTypes(){try{const r=localStorage.getItem(PREFIX+'items_types');if(r!==null)return JSON.parse(r);}catch(e){}return [];}
function loadItemLocs(){try{const r=localStorage.getItem(PREFIX+'items_locs');if(r!==null)return JSON.parse(r);}catch(e){}return [];}
function saveItemTypes(a){try{localStorage.setItem(PREFIX+'items_types',JSON.stringify(a));}catch(e){}}
function saveItemLocs(a){try{localStorage.setItem(PREFIX+'items_locs',JSON.stringify(a));}catch(e){}}
function renderItems(mid,sid){
  const m=findModule(mid),s=findSub(mid,sid);if(!m||!s)return renderModule(mid);
  state.module=mid;state.sub=sid;state.guest=false;state.sched=null;
  const rows=loadRows(mid,sid);
  function norm(r){
    const v=r.vals||[];
    if(v.length>=5){return {name:String(v[0]||''),type:String(v[1]||'')||'未分类',loc:String(v[2]||'')||'未指定',qty:String(v[3]||''),val:String(v[4]||''),note:String(v[5]||'')};}
    const p0=String(v[0]||'').split('·');
    const p1=String(v[1]||'').split(/[·/]/);
    return {name:(p0.length>1?p0[1]:p0[0]).trim(),type:p0.length>1?p0[0].trim():'未分类',loc:(p1.length>1?p1[0]:'').trim()||'未指定',qty:p1.length>1?p1[1].trim():'',val:String(v[2]||''),note:''};
  }
  const items=rows.map(r=>({row:r,n:norm(r)}));
  const customTypes=loadItemTypes();

let pomoRunning=false,pomoInterval=null,pomoMode="countdown",pomoSeconds=25*60,pomoStartTimestamp=0,pomoCurrentId=null;
function startPomodoro() {
  if (pomoRunning) return;
  if (!pomoCurrentId) {
    const tasks = loadPomoTasks();
    const t = tasks.find(x => !x.done) || tasks[0];
    if (t) { pomoCurrentId = t.id; updatePomoCurrentLabel(); }
  }
  pomoRunning = true;
  pomoMode = document.getElementById('pomoMode')?.value || 'countdown';
  pomoStartTimestamp = Date.now();
  updatePomoCurrentLabel();
  
  pomoInterval = setInterval(() => {
    if (pomoMode === 'countdown') {
      pomoSeconds--;
      if (pomoSeconds <= 0) {
        stopPomodoro();
        alert('🍅 番茄时间到！休息一下吧~');
        pomoSeconds = 25 * 60;
        // Update stats
        try {
          const statsRaw = localStorage.getItem(PREFIX + 'pomo_stats');
          const stats = statsRaw ? JSON.parse(statsRaw) : { today: 0, todayMin: 0 };
          stats.today = (stats.today || 0) + 1;
          stats.todayMin = (stats.todayMin || 0) + 25;
          localStorage.setItem(PREFIX + 'pomo_stats', JSON.stringify(stats));
        } catch(e) {}
      }
    } else {
      pomoSeconds++;
    }
    updatePomoDisplay();
  }, 1000);
}

function stopPomodoro() {
  pomoRunning = false;
  if (pomoInterval) { clearInterval(pomoInterval); pomoInterval = null; }
}

function resetPomodoro() {
  stopPomodoro();
  const mins = parseInt(document.getElementById('pomoMinutes')?.value || '25');
  pomoSeconds = mins * 60;
  updatePomoDisplay();
}

function updatePomoDisplay() {
  const el = document.getElementById('pomoDisplay');
  if (!el) return;
  const m = Math.floor(pomoSeconds / 60);
  const s = pomoSeconds % 60;
  el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function loadPomoTasks(){try{const r=localStorage.getItem(PREFIX+'pomo_tasks');if(r!==null)return JSON.parse(r);}catch(e){}return [];}
function savePomoTasks(t){try{localStorage.setItem(PREFIX+'pomo_tasks',JSON.stringify(t));}catch(e){}}
function renderPomoTasks(){
  const tasks=loadPomoTasks();
  const container=document.getElementById('pomoTasks');
  if(!container)return;
  container.innerHTML=tasks.map(t=>`
    <div class="planitem ${t.done?'done':''} ${t.id===pomoCurrentId?'sel':''}" data-pomotask="${t.id}">
      <span class="ck" data-pomotoggle="${t.id}">${t.done?'✓':''}</span>
      <div class="pt">
        <div class="ptt" contenteditable="true" data-pomotasktxt="${t.id}">${esc(t.name)}</div>
        <div class="ptd"><span data-pomotaskdur="${t.id}">${t.duration}分钟</span> · <span data-pomotaskstatus="${t.id}">${t.status}</span></div>
      </div>
      <button class="pdel" data-pomotdel="${t.id}">删除</button>
    </div>`).join('');
}
/* 更新番茄钟“当前任务”显示 */
function updatePomoCurrentLabel(){
  const el=document.getElementById('pomoTask');
  if(!el)return;
  const tasks=loadPomoTasks();
  const t=pomoCurrentId?tasks.find(x=>x.id===pomoCurrentId):null;
  el.textContent=t?('当前任务：'+t.name):'当前任务：（点击下方待办选择）';
}

function saveMemoFolderForm(){

  if(!title){toast('给备忘起个标题吧');return;}
  const content=($('[data-f="1"]').value||'').trim();
  const date=($('[data-f="2"]').value||'').trim()||nowStr();
  let folders=[];
  try{const raw=localStorage.getItem(PREFIX+'memo_folders');if(raw)folders=JSON.parse(raw);}catch(e){}
  if(!folders.length)folders=[{name:'默认',color:'#E88CA8',items:[]}];
  const fIdx=folders.findIndex(f=>f.name===fmMeta.folder);
  if(fIdx===-1)folders.push({name:fmMeta.folder,color:HABIT_COLORS[folders.length%HABIT_COLORS.length],items:[]});

  folder.items.push({title,content:content||'—',date,files:tempMemoFiles.slice(),ts:Date.now()});
  localStorage.setItem(PREFIX+'memo_folders',JSON.stringify(folders));
  tempMemoFiles=[];
  closeForm();render();
}

/* 阅读记录增强：摘抄感悟关联书单 */
function renderReadingV2(mid, sid) {
  const m = findModule(mid), s = findSub(mid, sid);
  if (!m || !s) return renderModule(mid);
  state.module = mid; state.sub = sid; state.guest = false; state.sched = null;
  const tab = state.rtab || 'books';
  const books = loadRead('read_books', [

    ['《小王子》', '想读', '-']
  ]);
  const quotes = loadRead('read_quotes', []);
  const notes = loadRead('read_notes', []);
  
  // Filter quotes/notes by book
  const bookQuotes = {};
  const bookNotes = {};
  quotes.forEach(q => {
    const book = q.vals[0] || '未分类';
    if (!bookQuotes[book]) bookQuotes[book] = [];
    bookQuotes[book].push(q);
  });
  notes.forEach(n => {

  const bookPanel = `

      <tbody>

          const bookName = r.vals[0] || '';

    </div>`;
  }).join('')}</div>` : `<div class="empty">还没有摘抄，看到喜欢的句子就记下来吧 ✿</div>`;

  const noteWall = notes.length ? `<div class="quotewall">${notes.map((n, i) => {
    const imgs = n.images || [];
    return `<div class="note" style="--rot:${READ_ROTS[(i + 2) % READ_ROTS.length]}">
      <span class="ndel" data-rndel="${i}">×</span>
      <div class="q">${esc(n.vals[1] || '')}</div>

  const tabPanel = tab === 'books' ? bookPanel :
    tab === 'quotes' ? `<div class="toolbar"><div class="ph" style="margin:0"><span class="ic">📝</span> 读书摘抄</div><button class="addbtn" data-addreadq style="--cc:${m.cc}">＋ 记一条摘抄</button></div><div class="pd">看到喜欢的句子随手记下，还能配一张书的照片。</div>${quoteWall}` :

  };
  function applyTheme(name){
    var t=themes[name];if(!t)return;
    var r=document.documentElement.style;
    r.setProperty('--bg',t.bg);r.setProperty('--bg2',t.bg2);r.setProperty('--card',t.card);
    r.setProperty('--line',t.line);r.setProperty('--line2',t.line2);r.setProperty('--ink',t.ink);
    r.setProperty('--ink-dim',t.inkDim);r.setProperty('--ink-faint',t.inkFaint);
    r.setProperty('--pink',t.pink);r.setProperty('--coral',t.coral);r.setProperty('--mint',t.mint);
    r.setProperty('--lemon',t.lemon);r.setProperty('--lilac',t.lilac);r.setProperty('--blue',t.blue);
    localStorage.setItem('lifeArchive_theme',name);
    document.querySelectorAll('.theme-opt').forEach(function(el){
      el.classList.toggle('active',el.dataset.theme===name);
    });
  }
  document.addEventListener('click',function(e){
    if(e.target.id==='themeBtn'){
      document.querySelector('.theme-picker').classList.toggle('show');
      return;
    }
    if(e.target.classList.contains('theme-opt')){
      applyTheme(e.target.dataset.theme);
      document.querySelector('.theme-picker').classList.remove('show');
    }
    if(e.target.id==='themePickerClose'){
      document.querySelector('.theme-picker').classList.remove('show');
    }
  });
  var saved=localStorage.getItem('lifeArchive_theme')||'pink';
  applyTheme(saved);
})();

    toast((skType === 'lang' ? '语言' : '技能') + '记录已保存');
    render();

  }
  // 技能/语言：删除一项

  if (skitemdel) {
    var sd = skitemdel.dataset.skitemdel.split('__');

/* 通用轻提示（补充页面缺失的 toast） */
function toast(msg){
  try{
    const t=document.createElement('div');
    t.textContent=msg;
    t.style.cssText='position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:rgba(90,70,80,.92);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;z-index:300;pointer-events:none;transition:opacity .3s';
    document.body.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),350);},2200);
  }catch(e){}
}
